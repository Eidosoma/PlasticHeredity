targets_version: E01-S02-v1.0.0

items:
  - id: E01-A001
    category: source_provenance
    parameter: source.paper.complete_formula_source
    materiality: critical
    evidence: 'Attachment sidecar: original PDF not materialized; extracted Markdown lines 81, 83, and 95 contain formula-not-decoded placeholders.'
    issue: The complete displayed equations for Phi-r and CLR are unavailable in the supplied text extraction.
    candidates: 'author PDF or authoritative equation-bearing source; otherwise explicit unresolved formula'
    selected: 'UNRESOLVED::E01-A001'
    status: DEFERRED_EVIDENCE
    basis: Source recovery belongs to immutable source collection, not inference from results.
    owner: S03
    claims: ALL
    discrepancies: D08

  - id: E01-A002
    category: source_provenance
    parameter: source.author_code.revision
    materiality: critical
    evidence: 'Paper line 125 promises code upon publication; no code or supplementary material accompanies the attachment.'
    issue: The author implementation and its revision are unavailable.
    candidates: 'immutable author-code commit if released; explicit unavailable sentinel'
    selected: 'UNRESOLVED::E01-A002'
    status: DEFERRED_EVIDENCE
    basis: No implementation identity can be inferred from prose.
    owner: S03
    claims: ALL
    discrepancies: ''

  - id: E01-A003
    category: source_provenance
    parameter: source.gard_historical.revision
    materiality: high
    evidence: 'FULL_PLAN names ModelingOriginsofLife/GARD and specific MATLAB files but does not pin a commit in S02.'
    issue: Historical reference behavior depends on an immutable repository revision.
    candidates: 'commit selected and hashed in S03; unavailable sentinel if retrieval fails'
    selected: 'UNRESOLVED::E01-A003'
    status: DEFERRED_EVIDENCE
    basis: Source pinning is explicitly assigned to S03.
    owner: S03
    claims: ALL
    discrepancies: ''

  - id: E01-A004
    category: source_provenance
    parameter: source.phiid_reference.revision
    materiality: critical
    evidence: 'FULL_PLAN requires an authoritative phyid implementation but no source identity is yet frozen.'
    issue: PhiID atom names and estimator behavior are implementation-version dependent.
    candidates: 'authoritative immutable phyid commit selected in S03; explicit unresolved sentinel'
    selected: 'UNRESOLVED::E01-A004'
    status: DEFERRED_EVIDENCE
    basis: S03 owns source and environment snapshots.
    owner: S03
    claims: ALL
    discrepancies: D08

  - id: E01-A005
    category: gard_dynamics
    parameter: gard.model.variant
    materiality: critical
    evidence: 'Paper Methods line 63 says the original GARD model was adopted; no executable version is identified.'
    issue: Original GARD denotes a literature family rather than one uniquely specified algorithm.
    candidates: 'historical-reference behavior; paper-described Poisson behavior; independent modern behavior'
    selected: 'UNRESOLVED::E01-A005'
    status: DEFERRED_EVIDENCE
    basis: Historical source audit and implementation comparison are required.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A006
    category: gard_dynamics
    parameter: gard.beta.distribution_parameterization
    materiality: critical
    evidence: 'Paper lines 65 and 69 call beta lognormal with mean A=-4 and SD sigma=4, which cannot be arithmetic-scale moments; FULL_PLAN defines beta=exp(A+sigma*epsilon).'
    issue: Mean and standard deviation could refer to log-space or arithmetic-scale parameters.
    candidates: 'log beta ~ Normal(A,sigma^2); alternative lognormal conventions only as discrepancy checks'
    selected: 'beta_ij=exp(A+sigma*epsilon_ij), epsilon_ij~N(0,1)'
    status: PLAN_FIXED
    basis: FULL_PLAN freezes the log-space interpretation and forbids treating historical defaults as author settings.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A007
    category: gard_dynamics
    parameter: gard.beta.orientation_and_diagonal
    materiality: high
    evidence: 'Paper only describes a catalytic matrix; FULL_PLAN writes beta_ij in a rate equation but author index orientation and self-catalysis handling are not stated.'
    issue: Transposition and diagonal inclusion change catalytic effects.
    candidates: 'historical orientation with diagonal; transposed audit; diagonal-excluded audit'
    selected: 'BRANCH_SET::historical_orientation_with_diagonal|transpose_audit|diagonal_exclusion_audit'
    status: FROZEN_BRANCH_SET
    basis: Preserve the historical interpretation and adversarial orientation controls until S04 source tracing.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A008
    category: gard_dynamics
    parameter: gard.beta.lifetime_per_run
    materiality: high
    evidence: 'Paper line 65 says each simulation has a catalytic matrix beta; Results line 31 says independent random seeds.'
    issue: It is not explicit whether beta is fixed for all generations and treatments or regenerated.
    candidates: 'one fixed beta per run and paired treatment triplet; regeneration by generation; regeneration by treatment'
    selected: 'one fixed beta per run; same beta across paired intervention treatments'
    status: PROVISIONAL_PRIMARY
    basis: Singular wording and the FULL_PLAN paired-matrix design support one fixed matrix, pending source audit.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A009
    category: gard_dynamics
    parameter: gard.kinetics.k_f
    materiality: critical
    evidence: 'Paper omits k_f; FULL_PLAN notes historical public default 1e-2 is reference-only and not an assumed author setting.'
    issue: Forward uptake rate is not reported.
    candidates: 'author value if recovered; historical 1e-2 reference branch; calibrated branches declared before results'
    selected: 'UNRESOLVED::E01-A009'
    status: UNRESOLVED_REQUIRED
    basis: Historical default cannot silently become the paper value.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A010
    category: gard_dynamics
    parameter: gard.kinetics.k_b
    materiality: critical
    evidence: 'Paper omits k_b; FULL_PLAN notes historical public default 1e-4 is reference-only and not an assumed author setting.'
    issue: Backward loss rate is not reported.
    candidates: 'author value if recovered; historical 1e-4 reference branch; calibrated branches declared before results'
    selected: 'UNRESOLVED::E01-A010'
    status: UNRESOLVED_REQUIRED
    basis: Historical default cannot silently become the paper value.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A011
    category: gard_dynamics
    parameter: gard.environment.rho_i
    materiality: critical
    evidence: 'Paper describes an environment but does not report molecular-type concentrations; FULL_PLAN marks rho_i explicit ambiguity.'
    issue: Uptake depends on the environmental concentration vector and its normalization.
    candidates: 'uniform rho_i; historical source vector; author vector; normalized and unnormalized branches'
    selected: 'UNRESOLVED::E01-A011'
    status: UNRESOLVED_REQUIRED
    basis: Uniformity is not stated and must not be assumed.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A012
    category: gard_dynamics
    parameter: gard.kinetics.propensity_equations
    materiality: critical
    evidence: 'Paper gives prose Poisson uptake/loss; FULL_PLAN gives historical-reference a_i+ and a_i- equations and a Gillespie interpretation.'
    issue: The author event rates and normalization are absent.
    candidates: 'historical-reference equations; paper-described batch Poisson equations; modern Gillespie propensities'
    selected: 'BRANCH_SET::historical_reference|paper_poisson_reconstruction|modern_gillespie'
    status: FROZEN_BRANCH_SET
    basis: FULL_PLAN explicitly requires these interpretations to remain distinct.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A013
    category: gard_dynamics
    parameter: gard.update.kernel
    materiality: critical
    evidence: 'Paper line 67 says stochastic Poisson updates of counts; FULL_PLAN warns not to conflate historical code, paper prose, and Gillespie semantics.'
    issue: Simultaneous Poisson count updates and one-event-at-a-time simulation generate different trajectories.
    candidates: 'vector Poisson batch; historical update loop; direct Gillespie event sampling'
    selected: 'BRANCH_SET::paper_vector_poisson|historical_loop|direct_gillespie'
    status: FROZEN_BRANCH_SET
    basis: All defensible kernels must be versioned separately.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A014
    category: gard_dynamics
    parameter: gard.update.poisson_exposure
    materiality: critical
    evidence: 'Paper does not report the Poisson interval or how rates are converted into expected counts.'
    issue: Batch Poisson means require an exposure or time increment.
    candidates: 'unit exposure; historical timestep; event-adaptive exposure; author value if recovered'
    selected: 'UNRESOLVED::E01-A014'
    status: UNRESOLVED_REQUIRED
    basis: Unit exposure would be an undocumented default.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A015
    category: gard_dynamics
    parameter: gard.time.molecular_step_definition
    materiality: critical
    evidence: 'Paper indexes trajectories by molecular step but uses Poisson updates that may change multiple molecules.'
    issue: A molecular step may mean one update, one molecule event, or elapsed stochastic time.
    candidates: 'one batch update; one individual event; expanded molecule events; continuous Gillespie time'
    selected: 'UNRESOLVED::E01-A015'
    status: UNRESOLVED_REQUIRED
    basis: Outcome durations and every time-series claim depend on this unit.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A016
    category: gard_dynamics
    parameter: gard.update.loss_nonnegativity
    materiality: high
    evidence: 'Paper does not state how Poisson losses exceeding current counts are handled.'
    issue: Clipping, resampling, binomial loss, or eventwise execution changes mass and bias.
    candidates: 'clip; resample; cap-distribution; eventwise rejection; historical behavior'
    selected: 'UNRESOLVED::E01-A016'
    status: UNRESOLVED_REQUIRED
    basis: Nonnegative integer state is mandatory but the enforcement rule is unknown.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A017
    category: gard_dynamics
    parameter: gard.growth.boundary_handling
    materiality: high
    evidence: 'Paper stops growth when n_max is reached but batch updates can overshoot 80.'
    issue: Overshoot can be retained, truncated, rejected, or expanded eventwise.
    candidates: 'retain overshoot; truncate final batch; reject batch; eventwise stop at 80'
    selected: 'UNRESOLVED::E01-A017'
    status: UNRESOLVED_REQUIRED
    basis: Fission composition depends on boundary handling.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A018
    category: gard_dynamics
    parameter: gard.growth.max_steps_terminal_semantics
    materiality: high
    evidence: 'Paper line 67 says updates stop at n_max or max_steps and then the generation ends.'
    issue: It is unclear whether a subcritical assembly fissions when max_steps is reached and how the terminal state is logged.
    candidates: 'force fission; abandon generation/run; retain without fission; historical behavior'
    selected: 'UNRESOLVED::E01-A018'
    status: UNRESOLVED_REQUIRED
    basis: Prose does not resolve failure-to-grow behavior.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A019
    category: gard_dynamics
    parameter: gard.initial_state.construction
    materiality: critical
    evidence: 'Paper line 65 says n_min molecular types are sampled uniformly without replacement from N_g types.'
    issue: The wording conflates molecules and types; the likely interpretation is 40 distinct types with one molecule each.
    candidates: '40 distinct types with count one; 40 molecules sampled without type replacement; historical initializer'
    selected: '40 distinct uniformly sampled types, one molecule per selected type'
    status: PROVISIONAL_PRIMARY
    basis: This is the literal count-preserving reading; source audit must confirm it.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A020
    category: gard_dynamics
    parameter: gard.initial_state.rng_stream
    materiality: medium
    evidence: 'Paper reports different random seeds but not whether initialization shares a stream with beta or dynamics.'
    issue: Shared streams couple unrelated random choices and impede exact regeneration.
    candidates: 'dedicated initialization stream; shared global stream; historical RNG order'
    selected: 'UNRESOLVED::E01-A020'
    status: DEFERRED_EVIDENCE
    basis: S06 will freeze separate seed streams after engine behavior is known.
    owner: S06
    claims: ALL
    discrepancies: ''

  - id: E01-A021
    category: gard_dynamics
    parameter: gard.environment.reservoir_semantics
    materiality: high
    evidence: 'Paper calls the environment a prebiotic soup but does not specify depletion, replenishment, or rho_i updates.'
    issue: Constant versus depleting reservoirs alter uptake and stationarity.
    candidates: 'constant infinite reservoir; finite depleted reservoir; generation-reset reservoir; historical behavior'
    selected: 'UNRESOLVED::E01-A021'
    status: UNRESOLVED_REQUIRED
    basis: Constant reservoir is plausible but not stated.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A022
    category: gard_dynamics
    parameter: gard.fission.sampling_semantics
    materiality: high
    evidence: 'Paper line 67 and FULL_PLAN specify Binomial(n_i,0.5) daughter counts.'
    issue: Independence across types and whether the complementary daughter is explicitly formed are unstated.
    candidates: 'independent per-type binomial followed daughter with complement; per-molecule Bernoulli equivalent; historical ordering'
    selected: 'n_i_followed ~ Binomial(n_i_pre,0.5); other daughter is complement'
    status: PLAN_FIXED
    basis: FULL_PLAN freezes this reconstruction while retaining source-order tests for S04.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A023
    category: gard_dynamics
    parameter: gard.fission.daughter_selection
    materiality: critical
    evidence: 'Results line 31 says simulation continued from one daughter but does not state which or how chosen.'
    issue: First, larger, random, or conditioned daughter selection changes lineage dynamics.
    candidates: 'first sampled daughter; uniformly random daughter; larger daughter; historical behavior'
    selected: 'UNRESOLVED::E01-A023'
    status: UNRESOLVED_REQUIRED
    basis: No daughter rule is supplied.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A024
    category: gard_dynamics
    parameter: gard.fission.post_fission_continuation
    materiality: high
    evidence: 'Paper depicts continuation from one daughter but does not state replenishment to n_min or handling of an empty daughter.'
    issue: Replenishing or rejecting daughters changes generation initial states.
    candidates: 'continue exact daughter; redraw empty daughter; replenish to n_min; historical behavior'
    selected: 'UNRESOLVED::E01-A024'
    status: UNRESOLVED_REQUIRED
    basis: Exact daughter continuation is plausible but edge-case behavior is missing.
    owner: S04
    claims: ALL
    discrepancies: ''

  - id: E01-A025
    category: preprocessing
    parameter: preprocessing.state_sampling_instant
    materiality: high
    evidence: 'Figure 1D says relative compositions at every molecular step; event/fission boundary inclusion is not stated.'
    issue: Pre-event, post-event, pre-fission, and post-fission states produce shifted trajectories.
    candidates: 'post-update states; pre-update states; include both fission boundaries; generation-only states'
    selected: 'UNRESOLVED::E01-A025'
    status: UNRESOLVED_REQUIRED
    basis: Time alignment must be frozen before Phi-r or labels are computed.
    owner: S06
    claims: ALL
    discrepancies: ''

  - id: E01-A026
    category: preprocessing
    parameter: preprocessing.composition.normalization
    materiality: high
    evidence: 'Paper line 93 uses relative molecular composition; FULL_PLAN defines x_i=n_i/N.'
    issue: The denominator and treatment of any zero-total state must be explicit.
    candidates: 'x_i=n_i/sum(n); reject zero-total states; explicit empty-state sentinel'
    selected: 'x_i=n_i/sum_j(n_j); zero-total state is invalid and must raise a recorded failure'
    status: PLAN_FIXED
    basis: FULL_PLAN supplies the normalization and no valid GARD assembly should have N=0.
    owner: S09
    claims: ALL
    discrepancies: ''

  - id: E01-A027
    category: preprocessing
    parameter: preprocessing.zero.policy
    materiality: critical
    evidence: 'Paper applies CLR but never states how zero component counts avoid log(0); FULL_PLAN requires pseudocount and multiplicative-replacement alternatives.'
    issue: Zero handling can dominate log-ratio coordinates and covariance.
    candidates: 'pseudocount grid; multiplicative replacement; reject invalid rows only as explicit failure'
    selected: 'BRANCH_SET::pseudocount_grid|multiplicative_replacement'
    status: FROZEN_BRANCH_SET
    basis: FULL_PLAN prohibits one hidden zero policy.
    owner: S09
    claims: ALL
    discrepancies: ''

  - id: E01-A028
    category: preprocessing
    parameter: preprocessing.zero.pseudocount_delta
    materiality: high
    evidence: 'Paper gives no delta; FULL_PLAN freezes six values.'
    issue: Delta changes rare-component leverage.
    candidates: '1e-6; 1e-4; 1e-2; 0.1; 0.5; 1'
    selected: 'BRANCH_SET::1e-6|1e-4|1e-2|0.1|0.5|1'
    status: FROZEN_BRANCH_SET
    basis: Every frozen delta is a separate specification; none is silently primary.
    owner: S09
    claims: ALL
    discrepancies: ''

  - id: E01-A029
    category: preprocessing
    parameter: preprocessing.clr.logarithm_and_formula
    materiality: high
    evidence: 'Paper CLR equation is not decoded at line 95; prose describes geometric-mean CLR; FULL_PLAN writes the standard log-ratio formula.'
    issue: Log base and pseudocount placement determine scale and zeros.
    candidates: 'natural-log CLR after closure-preserving pseudocount; base-2 audit'
    selected: 'natural-log CLR of closed pseudocount-adjusted composition'
    status: PROVISIONAL_PRIMARY
    basis: Figure 2 labels Phi-r in nats and FULL_PLAN uses natural-log notation.
    owner: S09
    claims: ALL
    discrepancies: D08

  - id: E01-A030
    category: preprocessing
    parameter: preprocessing.clr.component_removal
    materiality: critical
    evidence: 'Paper line 97 removes the last component; FULL_PLAN requires all dropped-component choices and ILR comparison.'
    issue: Arbitrary component dropping can alter estimator conditioning and paper matching.
    candidates: 'drop final component paper-like; drop each component in turn; no drop only for diagnostics; ILR'
    selected: 'BRANCH_SET::drop_last|drop_each_component|ILR'
    status: FROZEN_BRANCH_SET
    basis: Paper-like drop-last is retained but cannot be the only valid specification.
    owner: S09
    claims: ALL
    discrepancies: ''

  - id: E01-A031
    category: preprocessing
    parameter: preprocessing.coordinate_family
    materiality: high
    evidence: 'FULL_PLAN requires dropped CLR, ILR, raw proportions, Hellinger, principal log-ratio, and multiplicative-replacement alternatives.'
    issue: Coordinate geometry may create or remove apparent information structure.
    candidates: 'paper-like CLR; ILR; raw proportions; Hellinger; principal log-ratio coordinates'
    selected: 'BRANCH_SET::CLR|ILR|raw_proportions|Hellinger|principal_log_ratio'
    status: FROZEN_BRANCH_SET
    basis: All named adversarial representations remain preregistered.
    owner: S09
    claims: ALL
    discrepancies: ''

  - id: E01-A032
    category: preprocessing
    parameter: preprocessing.feature_orientation_and_scaling
    materiality: high
    evidence: 'Paper gives trajectory shape N_g x n_tot but does not specify estimator orientation, additional centering, whitening, or variance scaling.'
    issue: Transposition and scaling alter covariance and model inputs.
    candidates: 'time rows/features columns without extra scaling; feature z-score; whitening; implementation-native orientation'
    selected: 'UNRESOLVED::E01-A032'
    status: UNRESOLVED_REQUIRED
    basis: Estimator and MLP interfaces must declare rather than infer orientation/scaling.
    owner: S09
    claims: ALL
    discrepancies: ''

  - id: E01-A033
    category: preprocessing
    parameter: preprocessing.invalid_transform_policy
    materiality: high
    evidence: 'Paper does not state behavior for nonfinite CLR rows, singular covariance, or insufficient rank.'
    issue: Silent row deletion changes time and outcome alignment.
    candidates: 'fail specification; explicit regularized branch; explicit row exclusion with audit; never silently drop'
    selected: 'UNRESOLVED::E01-A033'
    status: UNRESOLVED_REQUIRED
    basis: FULL_PLAN forbids hidden exclusions and requires numerical diagnostics.
    owner: S09
    claims: ALL
    discrepancies: ''

  - id: E01-A034
    category: replicator_labels
    parameter: labels.similarity.metric
    materiality: critical
    evidence: 'Paper line 71 says highly similar in Euclidean space; Results says threshold to most recurring composition; FULL_PLAN defines historical cosine-like H and Euclidean/Aitchison alternatives.'
    issue: Euclidean, cosine, and Aitchison geometries label different states.
    candidates: 'historical H/cosine; Euclidean; Aitchison/ILR'
    selected: 'BRANCH_SET::historical_H|Euclidean|Aitchison'
    status: FROZEN_BRANCH_SET
    basis: FULL_PLAN requires all three label families.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: ''

  - id: E01-A035
    category: replicator_labels
    parameter: labels.similarity.threshold
    materiality: critical
    evidence: 'Paper says a similarity threshold but omits its value; RESEARCH_PLAN S08 names historical H>0.9.'
    issue: Threshold choice controls replicator occupancy and every downstream label-based result.
    candidates: 'historical H>0.9; preregistered sensitivity grid; source-recovered author threshold'
    selected: 'historical label uses H>0.9; sensitivity grid must be versioned before S08 results'
    status: PLAN_FIXED
    basis: S08 explicitly instructs historical H>0.9 while requiring threshold sensitivity.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: ''

  - id: E01-A036
    category: replicator_labels
    parameter: labels.compotype.reference_definition
    materiality: critical
    evidence: 'Results line 31 refers to the most recurring composition; no selection, update, or tie rule is given.'
    issue: Global mode, cluster medoid, centroid, or online reference can yield circular labels.
    candidates: 'retrospective modal compotype; cluster medoid; centroid; past-only online reference; historical nondrift rule'
    selected: 'UNRESOLVED::E01-A036'
    status: DEFERRED_EVIDENCE
    basis: Historical nondrift source and synthetic audits are needed.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: ''

  - id: E01-A037
    category: replicator_labels
    parameter: labels.clustering.algorithm_and_hyperparameters
    materiality: critical
    evidence: 'Figure 1C calls replicators tight clusters; algorithm, number of clusters, linkage, epsilon, and minimum size are absent.'
    issue: Cluster method and hyperparameters define the label target.
    candidates: 'historical nondrift/compotype procedure; density clustering; hierarchical clustering; preregistered alternatives'
    selected: 'UNRESOLVED::E01-A037'
    status: DEFERRED_EVIDENCE
    basis: S08 must reconstruct historical labels and quantify disagreement.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: ''

  - id: E01-A038
    category: replicator_labels
    parameter: labels.persistence_and_homeostasis_rule
    materiality: critical
    evidence: 'Paper defines recurring compositions with homeostatic growth but gives no minimum recurrence, duration, or generation count.'
    issue: Transient similarity may be called replication without a persistence rule.
    candidates: 'historical nondrift persistence; minimum episode duration; minimum generation recurrence; basin-return probability'
    selected: 'UNRESOLVED::E01-A038'
    status: UNRESOLVED_REQUIRED
    basis: Persistence cannot be inferred from descriptive prose.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: ''

  - id: E01-A039
    category: replicator_labels
    parameter: labels.temporal_information_scope
    materiality: critical
    evidence: 'Most-recurring composition suggests whole-run hindsight; prospective prediction claims require careful temporal separation.'
    issue: Retrospective labels can leak future trajectory information into predictors and endpoints.
    candidates: 'paper-like retrospective labels; past-only online labels; fixed training-derived compotypes'
    selected: 'BRANCH_SET::paper_retrospective|past_only_online|training_derived_reference'
    status: FROZEN_BRANCH_SET
    basis: Paper-like description and leakage-safe alternatives must receive separate verdicts.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: D03

  - id: E01-A040
    category: replicator_labels
    parameter: labels.molecular_step_alignment
    materiality: high
    evidence: 'Labels are described at any time step while clusters may be defined at generation or steady-state resolution.'
    issue: Propagating generation labels to molecular steps changes occupancy and correlation alignment.
    candidates: 'per-step label; generation label broadcast to all steps; steady-state-only label; boundary-shift alternatives'
    selected: 'UNRESOLVED::E01-A040'
    status: UNRESOLVED_REQUIRED
    basis: The paper does not state label resolution.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: ''

  - id: E01-A041
    category: replicator_labels
    parameter: labels.ineligible_and_drift_policy
    materiality: high
    evidence: 'Paper uses drift as complement but does not state behavior for runs lacking either class or ambiguous threshold states.'
    issue: Excluding one-class runs silently changes denominators and Fisher combinations.
    candidates: 'drift=complement; explicit unknown label; run ineligible with recorded reason; no silent exclusion'
    selected: 'UNRESOLVED::E01-A041'
    status: UNRESOLVED_REQUIRED
    basis: Claim denominators require an explicit eligibility contract.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: D11

  - id: E01-A042
    category: replicator_labels
    parameter: labels.family_registry
    materiality: high
    evidence: 'FULL_PLAN requires historical, Euclidean, and Aitchison labels plus recurrence/fidelity alternatives.'
    issue: Choosing the closest-looking label after results would be post hoc optimization.
    candidates: 'Y_H historical; Y_E Euclidean; Y_A Aitchison; continuous recurrence; parent-daughter fidelity; basin return'
    selected: 'BRANCH_SET::Y_H|Y_E|Y_A|continuous_recurrence|parent_daughter_fidelity|basin_return'
    status: FROZEN_BRANCH_SET
    basis: Every family receives a specification ID and disagreement report.
    owner: S08
    claims: 'E01-C015:E01-C059'
    discrepancies: ''

  - id: E01-A043
    category: phi_estimation
    parameter: phi.atom.identity_and_formula
