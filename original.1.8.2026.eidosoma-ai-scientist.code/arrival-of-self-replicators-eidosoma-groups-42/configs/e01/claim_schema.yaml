discrepancies:
  D01:
    kind: denominator_wording
    summary: >-
      Results says 54/73 positive runs were significant, while Figure 3 says 54% of all
      100 runs were positive and significant. These are reconcilable only by preserving
      both the raw count (54) and both denominators.
  D02:
    kind: estimand_wording
    summary: >-
      Results describes a correlation between the Phi-r trajectory and replication state;
      the Figure 3 caption describes changes in Phi-r. Level and change are different estimands.
  D03:
    kind: prediction_endpoint_wording
    summary: >-
      Results describes predicting the remaining 75% of the full replication-state trajectory,
      while the Figure 5 title/caption calls the task prediction of initial appearance.
  D04:
    kind: unit_conflict
    summary: >-
      Table 1 prints time-to-first values with percent signs, but its note defines the outcome
      as a number of molecular steps.
  D05:
    kind: direction_conflict
    summary: >-
      Results says min-Phi-r significantly worsened all four outcomes, but Table 1 reports
      higher consistency for min (0.42) than control (0.38), where higher is defined as better.
  D06:
    kind: scope_conflict
    summary: >-
      Results says overall max-Phi-r probability did not significantly differ from control,
      whereas Discussion says maximizing yielded higher probability than original runs.
      The latter may refer only to the final generation, but does not say so there.
  D07:
    kind: spike_definition_gap
    summary: >-
      Text defines spikes as positive excursions more than three standard deviations above
      the overall mean and says most runs spike, but gives no run count or thresholding scope;
      plotted examples also contain prominent negative excursions.
  D08:
    kind: undecoded_formula
    summary: >-
      The supplied paper extraction contains two formula-not-decoded placeholders for the
      causal-emergence definition, preventing equation-level method linkage in S01.
  D09:
    kind: statistic_label_ambiguity
    summary: >-
      Figure 6C prints coefficients next to regression lines using rho-like notation, leaving
      unclear whether they are regression slopes or correlation coefficients.
  D10:
    kind: dispersion_undefined
    summary: >-
      Table 1 reports plus/minus quantities without defining whether they are standard
      deviations, standard errors, or confidence-interval half-widths.
  D11:
    kind: significance_scope_ambiguity
    summary: >-
      The p<0.001 Mann-Whitney statement for replicator versus drift steps does not state
      clearly whether it is a pooled test, a representative run, or a summary of runwise tests.
  D12:
    kind: spike_height_missing_statistic
    summary: >-
      Spike height is called nonsignificant without a reported coefficient or p-value.

