    unit_of_analysis: spike or run summary; not reported
    sample_scope: paper spike catalog; exact n not reported
    reproduction_estimand: Spearman association between spike height and self-replication probability
    reproduction_criterion: 'EXACT at reported precision if the paper-matched two-sided p>=0.05; DIRECTIONAL if the effect is practically small under a preregistered equivalence margin; NONREPLICATION if a robust association is found; exact coefficient replication is UNDERDETERMINED.'
    inferential_test: Spearman correlation
    specification_status: underdetermined_pending_S02
    downstream_step: S16
