sourceLineMappings:
  - behaviorId: public_v10_defaults
    sourceFile: tgs_parameters_v10.m
    lineStart: 7
    lineEnd: 27
    portSymbols: []
    finding: Kf=1e-2 and Kb=1e-4 are public historical defaults; rho is initially empty; three seed slots and legacy global RNG APIs are used.
  - behaviorId: catalytic_matrix_transform
    sourceFile: tgs_newbeta_v10.m
    lineStart: 7
    lineEnd: 10
    portSymbols:
      - e01_gard_historical.engine.catalytic_matrix_from_standard_normals
      - e01_gard_historical.engine.catalytic_matrix_from_numpy_rng_explicit
    finding: Apply exp(mu + sigma*z) elementwise with source orientation and diagonal retained; both legacy randn and rand global states are reset.
  - behaviorId: propensity_equations
    sourceFile: tgs_grow_v10.m
    lineStart: 6
    lineEnd: 16
    portSymbols:
      - e01_gard_historical.engine.compute_propensities
    finding: beta multiplies the state as beta@n; the same boost multiplies concatenated join-then-leave weights.
  - behaviorId: weighted_event_draw
    sourceFile: tgs_rndpdf.m
    lineStart: 15
    lineEnd: 42
    portSymbols:
      - e01_gard_historical.engine.historical_weighted_index
    finding: Draw a nonzero uniform, multiply by total weight, and use strict cumulative-boundary comparison.
  - behaviorId: stochastic_growth_and_rate_sum
    sourceFile: tgs_grow_v10.m
    lineStart: 13
    lineEnd: 33
    portSymbols:
      - e01_gard_historical.engine.grow_to_split_size
    finding: Apply one join or leave per loop, record signed one-based species, add total rate to dt, stop at nmax or extinction, and do not sample waiting time.
  - behaviorId: loss_nonnegativity
    sourceFile: tgs_grow_v10.m
    lineStart: 19
    lineEnd: 31
    portSymbols:
      - e01_gard_historical.engine.grow_to_split_size
    finding: Zero-count loss weights are zero; after a chosen loss the source checks and errors if the count is negative.
  - behaviorId: fixed_size_fission
    sourceFile: tgs_split_v10.m
    lineStart: 7
    lineEnd: 23
    portSymbols:
      - e01_gard_historical.engine.split_fixed_size_without_replacement
    finding: Sequentially sample floor(N/2) molecules without replacement into child A; child B is the remainder; one molecule is discarded for odd N.
  - behaviorId: environmental_fallback
    sourceFile: tgs_agard_v10.m
    lineStart: 18
    lineEnd: 37
    portSymbols: []
    finding: If rho length differs from NG the historical orchestrator supplies a constant uniform vector; beta is generated once if absent.
  - behaviorId: hidden_rng_and_initializer
    sourceFile: tgs_agard_v10.m
    lineStart: 39
    lineEnd: 51
    portSymbols:
      - e01_gard_historical.engine.historical_initial_state_with_replacement
    finding: Legacy global rand/randn state and seed calls are order-dependent; initial molecules are sampled with replacement before the explicit rand seed reset in this branch.
  - behaviorId: daughter_selection_and_continuation
    sourceFile: tgs_agard_v10.m
    lineStart: 59
    lineEnd: 83
    portSymbols:
      - e01_gard_historical.engine.advance_one_generation
      - e01_gard_historical.engine.simulate_lineage
    finding: The single-lineage orchestrator requests only split function output one, thereby following child A without another random daughter-choice draw or replenishment.
  - behaviorId: generation_endpoint_trace
    sourceFile: tgs_agard_v10.m
    lineStart: 53
    lineEnd: 97
    portSymbols:
      - e01_gard_historical.engine.advance_one_generation
      - e01_gard_historical.engine.simulate_lineage
    finding: Trace columns contain pre-fission generation endpoints, not every molecular event; time stores inverse of the accumulated rate sums.
  - behaviorId: h_similarity
    sourceFile: tgs_H.m
    lineStart: 14
    lineEnd: 25
    portSymbols:
      - e01_gard_historical.nondrift.historical_h
    finding: Column-wise cosine similarity uses epsilon 1e-7 denominators and clips results to [0,1].
  - behaviorId: nondrift_technique1
    sourceFile: tgs_nondrift.m
    lineStart: 21
    lineEnd: 45
    portSymbols:
      - e01_gard_historical.nondrift.historical_nondrift_technique1
    finding: Truncate at the first zero-sum column, L2-normalize, average adjacent H values at interior generations, and apply a strict threshold.
  - behaviorId: nondrift_technique2
    sourceFile: tgs_nondrift.m
    lineStart: 47
    lineEnd: 82
    portSymbols:
      - e01_gard_historical.nondrift.historical_nondrift_technique2
    finding: Optional consecutive-similarity runs are shifted one index earlier; a qualifying run beginning at the first element exposes an invalid MATLAB index-zero source edge case.
compatibilityBoundaries:
  - boundaryId: CB01
    subject: author implementation identity
    historicalBehavior: Public GARD v10 commit 86dff6320d5a only.
    paperOrModernBehavior: Author code is unavailable; no equivalence claim is allowed.
  - boundaryId: CB02
    subject: update kernel
    historicalBehavior: One weighted join/leave event per loop; no vector Poisson batch and no sampled Gillespie waiting time.
    paperOrModernBehavior: Paper vector-Poisson and modern Gillespie remain distinct registry branches.
  - boundaryId: CB03
    subject: time
    historicalBehavior: dt accumulates total rate and orchestrator records 1/dt.
    paperOrModernBehavior: This is not physical Gillespie time; paper molecular-step semantics remain unresolved.
  - boundaryId: CB04
    subject: fission
    historicalBehavior: Fixed-size without-replacement child A and complement child B; odd mass discards one molecule.
    paperOrModernBehavior: Paper/plan independent Binomial(n_i,0.5) semantics remain a separate branch.
  - boundaryId: CB05
    subject: daughter choice
    historicalBehavior: Follow first function output child A with no extra draw.
    paperOrModernBehavior: Paper only says one daughter; author choice remains unresolved.
  - boundaryId: CB06
    subject: initialization
    historicalBehavior: With-replacement molecule-type sampling under hidden legacy global RNG order.
    paperOrModernBehavior: Paper says without replacement; no silent substitution is allowed.
  - boundaryId: CB07
    subject: max steps
    historicalBehavior: The historical growth loop has no max_steps condition.
    paperOrModernBehavior: Paper max_steps=1000 and terminal semantics remain unresolved.
  - boundaryId: CB08
    subject: random streams
    historicalBehavior: Legacy MATLAB global rand/randn state APIs with order-dependent resets.
    paperOrModernBehavior: Exact cross-runtime stream equality is not claimed; explicit draw tapes bypass, rather than resolve, this ambiguity.
  - boundaryId: CB09
    subject: modern GARD
    historicalBehavior: Historical tgs_grow_v10.m SHA-256 72cae8cd5555f4605dbad1526d3221b7f3f03eb76cea35714499299b3aa068a0.
    paperOrModernBehavior: Modern nested grow file differs and adds flux output/logging; non-drift is byte-identical only at the pinned files.
  - boundaryId: CB10
    subject: license
    historicalBehavior: No repository license file detected; source remains reference-in-place and is not copied into artifacts or this repository.
    paperOrModernBehavior: The independent Python port is repository-authored; this is provenance separation, not legal advice.
