schema: eidosoma.e01.s06_seed_derivation_contract.v1
researchStepId: S06
experimentId: E01
contractVersion: E01-seed-derivation-contract-v1.0.0
seedSchemaVersion: E01-seed-schema-v1.0.0
canonicalJsonVersion: E01-canonical-json-v1.0.0
derivationAlgorithm: E01-SHA256-DOMAIN-SEPARATION-PCG64DXSM-v1
status: reconstruction_engineering_contract
scopeBoundary: >-
  This contract defines E01 reconstruction seeds. It does not identify the
  unavailable author implementation, legacy MATLAB rand/randn algorithms,
  global-state reset order, or the paper's stream-sharing policy.

canonicalJson:
  encoding: UTF-8
  objectKeys: lexicographically sorted
  separators: comma and colon with no surrounding whitespace
  ensureAscii: false
  numericRule: integers only; every binary64 value is a canonical float.hex string
  invalidValues: [NaN, Infinity, -Infinity, JSON numeric float, duplicate object key]

rootIdentity:
  requiredFields:
    - experimentId
    - specificationId
    - trajectoryId
    - replicateIndex
    - engineId
    - rootSeedHex
    - couplingPolicy
    - couplingReason
    - explicit namespace for every stream purpose
  rootSeedEncoding: exactly 32 bytes as 64 lowercase hexadecimal characters
  securityBoundary: Seeds are reproducibility identities, not cryptographic secrets.

streamPurposes:
  required:
    - catalytic_matrix
    - initial_state
    - event
    - waiting_time
    - fission
    - daughter_selection
    - intervention
    - estimator
    - machine_learning
  waitingTimeRationale: >-
    S05 gives direct Gillespie waiting time its own RNG input. Folding that input
    into event selection would regress the already validated stream separation.
  futureExtensionRule: >-
    A new stochastic purpose requires a versioned schema addition; it may not
    silently reuse an existing stream.

derivation:
  domainUtf8WithTerminalNul: EIDOSOMA-E01-SEED-DERIVATION-v1
  contextFieldsInCanonicalOrderBySerializer:
    - seedSchemaVersion
    - derivationAlgorithm
    - experimentId
    - replicateIndex
    - streamPurpose
    - streamNamespace
  preimage: >-
    domain_bytes || uint32_be(length(root_seed_bytes)) || root_seed_bytes ||
    uint64_be(length(canonical_context_utf8)) || canonical_context_utf8
  digest: SHA-256(preimage)
  seedInteger: unsigned big-endian integer represented by the complete 256-bit digest
  bitGenerator: numpy.random.PCG64DXSM
  generatorConstruction: numpy.random.Generator(numpy.random.PCG64DXSM(seed_integer))
  numpyVersion: 2.4.6
  compatibilityEvidence: >-
    The pinned NumPy PCG64DXSM documentation guarantees that a fixed seed
    reproduces the same random integer stream. Distribution samplers and engine
    floating-point operations remain scoped to the pinned same-engine runtime.

coupling:
  policies:
    trajectory_isolated:
      rule: >-
        Every purpose must explicitly use the canonical namespace
        urn:eidosoma:seed-namespace:{experiment}:{specification}:{trajectory}:r{replicate}.
      couplingReason: must be null
    explicit_common_random_numbers:
      rule: >-
        Every purpose namespace remains explicit and a nonempty scientific
        coupling reason is mandatory. Matching namespaces are the only permitted
        way to share raw streams across trajectories/specifications.
  noImplicitCoupling: true
  purposeDomainSeparation: true

engineBindings:
  e01_gard_independent:
    catalytic_matrix: catalytic_matrix
    initialization: initial_state
    events: event
    waiting_time: waiting_time
    fission: fission
    daughter: daughter_selection
    auxiliaryUnconsumedBySimulation: [intervention, estimator, machine_learning]
  e01_gard_historical:
    status: NONCONFORMING_TO_CANONICAL_SEEDED_REGENERATION
    exactFixtureMode: EXPLICIT_DRAW_TAPE_NO_RNG_ASSUMPTION
    reason: >-
      Historical public behavior uses a shared order-dependent legacy MATLAB
      global RNG. Assigning separate PCG64DXSM streams would change that behavior.
    authorMatlabIdentity: UNRESOLVED::LEGACY_MATLAB_RNG_ALGORITHM_AND_GLOBAL_STATE_ORDER

preservedRegistryBoundaries:
  registryVersion: E01-specification-registry-v0.3.0
  registrySha256: aef0e179de6466697540ba10236ed24af37fbda12bd4f1c6b1fb5fe7a27af891
  gard.initial_state.rng_stream: UNRESOLVED::E01-A020
  preprocessing.state_sampling_instant: UNRESOLVED::E01-A025
  authorCodeIdentity: UNAVAILABLE::NO_AUTHOR_CODE_RELEASE_FOUND
  rule: >-
    The canonical reconstruction policy is not an evidence-based resolution of
    either author-facing sentinel. Registry v0.3.0 remains byte-for-byte unchanged.

validationRequirements:
  - all nine derivations are unique
  - every serialized derivation regenerates exactly
  - known-answer seed vectors match
  - fresh generator objects are pairwise distinct
  - consuming auxiliary streams cannot alter a simulation trajectory
  - all manifest and payload checksums validate

