statisticalDesign:
  globalFamilywiseAlpha: 0.005
  primaryTestCount: 26
  multiplicityCorrection: BONFERRONI_SINGLE_GLOBAL_FAMILY
  perTestAlpha: 0.0001923076923076923
  multinomialMethod: EXACT_PARAMETRIC_MONTE_CARLO_WITH_PLUS_ONE_PVALUE
  multinomialStatistic: LOG_LIKELIHOOD_DEVIANCE_G2
  monteCarloReplicates: 199999
  monteCarloBatchSize: 5000
  minimumExpectedCountForAsymptoticDiagnostic: 25
  rareCategoryRule: >-
    Primary inference always uses the exact Monte Carlo multinomial null over
    every positive-probability category. Categories with expected count below
    25 are additionally pooled into one diagnostic rare bin. Pearson/chi-square
    asymptotics are prohibited whenever any unpooled or pooled expected count
    remains below 25. A structural-zero target receiving an observation is an
    immediate deterministic failure.
  momentMethod: >-
    For y=log(beta), use the exact normal z statistic for mean A and the exact
    chi-square statistic for unbiased sample variance sigma^2; both are
    two-sided and use the same Bonferroni per-test alpha.
  crossEngineMethod: >-
    For each legitimately matched event/fission fixture, compare the observed
    total-variation distance with paired independent multinomial samples from
    the known analytical target using the same plus-one Monte Carlo rule.
  passRule: >-
    Every one of the 26 preregistered primary p-values must be at least
    perTestAlpha, every deterministic invariant must have zero failures, every
    failure injection must be detected, and frozen evidence must remain intact.

