deterministicInvariants:
  allowedFailures: 0
  required:
    - categorical and direct-Gillespie events change mass by exactly +1 or -1
    - join events change exactly one selected species by +1
    - leave events change exactly one selected species by -1 without negativity
    - vector-Poisson state change equals applied joins minus applied losses
    - fixed even fission conserves the parent with zero discard and equal child sizes
    - fixed odd fission conserves the parent with exactly one discard and equal child sizes
    - binomial-complement fission conserves the parent with zero discard
    - deterministic first-daughter selection consumes no daughter RNG draw
    - uniform daughter selection is statistically tested and consumes the dedicated stream
    - all explicit catalytic orientation/diagonal branches match independent analytical propensities

failureInjection:
  requiredDetectedCount: 7
  cases:
    - {injectionId: FI01, target: event_multinomial, fault: move_3_percent_from_modal_to_next_category}
    - {injectionId: FI02, target: log_beta_mean, fault: add_0.05_sigma_to_each_log_beta}
    - {injectionId: FI03, target: categorical_mass, fault: add_two_to_recorded_post_mass}
    - {injectionId: FI04, target: fixed_fission_multinomial, fault: move_3_percent_from_modal_to_next_outcome}
    - {injectionId: FI05, target: fission_conservation, fault: add_one_unmatched_molecule_to_child_first}
    - {injectionId: FI06, target: poisson_multinomial, fault: move_3_percent_from_zero_to_one_count_bin}
    - {injectionId: FI07, target: branch_identity, fault: relabel_vector_poisson_batch_as_categorical_single_event}

