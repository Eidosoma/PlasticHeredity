comparisonContract:
  referenceFamilies: [Y_H, Y_C, Y_E, Y_A]
  binaryOverlap:
    denominator: common_nonnull_labels
    outputs: [intersection, union, jaccard, overall_agreement, positive_agreement]
    zeroUnionPolicy: emit_null_jaccard_with_reason_NO_POSITIVES_IN_EITHER_FAMILY
  binaryAdjustedRand:
    denominator: common_nonnull_labels
    fewerThanTwoPolicy: emit_null_with_reason_FEWER_THAN_TWO_COMMON_LABELS
  clusterAdjustedRand:
    families: [Y_C, Y_E, Y_A]
    driftEncoding: shared_NOISE_class
    denominator: common_nonnull_cluster_assignments
    ineligiblePolicy: retain_in_label_output_and_report_exclusion_count_here
  disagreement:
    outputs:
      - per_observation_family_vector
      - pairwise_one_sided_counts
      - run_level_disagreement_rate
      - retrospective_vs_past_only_flip_count
      - threshold_flip_count

validationGates:
  - Every frozen input hash matches before execution.
  - Registry v0.3.0 is byte-identical before and after execution and all nine S08 owner parameters retain their statuses and values.
  - Historical HC11 H, local scores, first-zero position, and labels match the S04 oracle exactly.
  - Exact-threshold H and distance cases obey strict comparison, not inclusive comparison.
  - Every input observation receives one output row for each of the four reference families; ineligible rows are null-labeled with reasons.
  - Seeded fixtures, retrospective order-audit permutations, and sequence-preserving past-only outputs regenerate exactly from the S06-derived streams.
  - Positive compositions are invariant under per-row positive scaling and common component permutation for all applicable metrics.
  - Aitchison never replaces a zero and never emits a finite distance for a non-strictly-positive observation.
  - Label, overlap, ARI, sensitivity, disagreement, and provenance artifacts pass independent row-count and checksum audits.
  - No S09 directory or implementation is created.

outcomeRule:
  supportive: >-
    All four reference families produce complete status-bearing label outputs,
    all preregistered validation gates pass, and disagreements are quantified.
  constrainingOrContradictory: >-
    An implementation or validation failure invalidates a family, or hidden
    exclusions/defaults are required to produce outputs.
  null: >-
    Available validated fixtures do not contain enough common eligible
    observations to quantify any family disagreement despite valid code.
