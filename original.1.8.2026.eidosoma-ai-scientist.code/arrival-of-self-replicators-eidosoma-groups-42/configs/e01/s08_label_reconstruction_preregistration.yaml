    timing: BEFORE_LABEL_OUTCOME_GENERATION
    change: >-
      Clarified that order-permutation invariance applies only to full-trace
      retrospective clustering. Past-only outputs are sequence-defined and
      therefore receive exact replay validation with observation order held
      fixed. No family, threshold, minimum size, fixture, or outcome rule
      changed.
frozenQuestion: >-
  Can the source-traceable historical non-drift label and explicit
  validation-only cosine, Euclidean, and Aitchison cluster labels be
  implemented without silently resolving author-facing ambiguity, and can
  their disagreements be quantified on validated fixtures?
scopeBoundary: >-
  The historical H calculation and tgs_nondrift techniques are traced only to
  the pinned public GARD v10 snapshot. The cosine, Euclidean, and Aitchison
  clustering configurations below are reconstruction validation branches,
  not recovered author settings and not paper-claim adjudication profiles.
  The unavailable author implementation and legacy MATLAB RNG identity remain
  unknown. S09 zero-resolution branches are not selected here.

