fixtureContract:
  source: s08FixtureCatalog
  fixtureCount: 5
  observationCount: 43
  dimensions: [2, 4]
  inputScalePolicy: >-
    Preserve every supplied value and row scale exactly. Integer count fixtures remain
    counts; the noninteger S04 HC11 source-oracle vectors remain nonnegative weights.
    Additive count-scale pseudocount results on HC11 are validation diagnostics and are
    not relabeled as count observations.
  pooledGroups:
    - groupId: E01-S09-POOL-D2-v1.0.0
      dimension: 2
    - groupId: E01-S09-POOL-D4-v1.0.0
      dimension: 4

zeroTreatments:
  pseudocountGrid: [1.0e-6, 1.0e-4, 1.0e-2, 0.1, 0.5, 1.0]
  branches:
    - branchId: ADDITIVE_COUNT_PSEUDOCOUNT
      evidenceClass: PLAN_FROZEN_VALIDATION_BRANCH_NOT_AUTHOR_DEFAULT
      specificationIdTemplate: E01-S09-ZERO-ADD-DELTA-{deltaTag}-v1.0.0
      formula: x_i=(n_i+delta)/(sum_j(n_j)+D*delta)
      eligibleDomain: finite nonnegative row including a zero-sum row
      zeroSumSemantics: map all-zero row to the uniform composition 1/D
      scaleProperty: count-scale dependent by design
    - branchId: MULTIPLICATIVE_REPLACEMENT_MATCHED_COUNT_DELTA
      evidenceClass: VALIDATION_ONLY_RECONSTRUCTION_NOT_AUTHOR_DEFAULT
      specificationIdTemplate: E01-S09-ZERO-MULT-MATCHDELTA-{deltaTag}-v1.0.0
      formula: >-
        For positive row mass N, close x=n/N, let q=delta/(N+D*delta), let z be
        the number of zero components, assign q to each zero, and multiply each
        positive x_i by (1-z*q). This preserves positive-part ratios and closure.
      eligibleDomain: finite nonnegative row with positive total mass
      zeroSumSemantics: >-
        Retain an explicit INELIGIBLE row with reason
        ZERO_SUM_NO_COMPOSITION_FOR_MULTIPLICATIVE_REPLACEMENT.
      scaleProperty: matched delta remains count-scale dependent when zeros occur
      rationale: >-
        Reusing every frozen count-scale delta gives direct additive-versus-multiplicative
        comparisons without selecting a second favorable replacement grid.
    - branchId: NO_ZERO_REPLACEMENT
      evidenceClass: STRICT_DOMAIN_VALIDATION_CONTROL_NOT_AUTHOR_DEFAULT
      specificationId: E01-S09-ZERO-NONE-v1.0.0
      formula: close positive-mass row without altering component zeros
      zeroSumSemantics: retain explicit INELIGIBLE row
      logRatioZeroSemantics: retain explicit INELIGIBLE row

coordinateFamilies:
  - coordinateId: FULL_CLR_DIAGNOSTIC
    specificationIdTemplate: E01-S09-COORD-FULLCLR-D{dimension}-v1.0.0
    formula: z=log(x)-mean(log(x))
    logarithm: natural
    dimensionRule: D
    covarianceBoundary: structurally rank-at-most-D-minus-1; never model-ready as full coordinates
  - coordinateId: DROPPED_COMPONENT_CLR
    specificationIdTemplate: E01-S09-COORD-DROPCLR-D{dimension}-C{componentOneBased}-v1.0.0
    formula: compute full CLR then remove exactly the named original component
    logarithm: natural
    dimensionRule: D-1
    componentCoverage: every component index from 1 through D
    paperLikeMember: final original component only
    inverseRule: insert omitted CLR coordinate as minus the sum of retained coordinates, exponentiate, and close
  - coordinateId: ILR_HELMERT
    specificationIdTemplate: E01-S09-COORD-ILR-HELMERT-D{dimension}-v1.0.0
    formula: y=V^T*log(x)
    basis: >-
      Sequential Helmert simplex basis in original component order: basis column j
      has 1/sqrt(j*(j+1)) in components 1..j, -j/sqrt(j*(j+1)) in component j+1,
      and zero thereafter, for one-based j=1..D-1.
    dimensionRule: D-1
    inverseRule: close(exp(V*y))
  - coordinateId: RAW_CLOSED_PROPORTIONS
    specificationIdTemplate: E01-S09-COORD-RAW-D{dimension}-v1.0.0
    formula: x
    dimensionRule: D
    role: REGISTRY_ADVERSARIAL_COORDINATE_CONTROL
    inverseRule: close(x)
  - coordinateId: HELLINGER
    specificationIdTemplate: E01-S09-COORD-HELLINGER-D{dimension}-v1.0.0
    formula: sqrt(x)
    dimensionRule: D
    role: REGISTRY_ADVERSARIAL_COORDINATE_CONTROL
    inverseRule: close(y^2)
  - coordinateId: PRINCIPAL_LOG_RATIO
    specificationIdTemplate: E01-S09-COORD-PLR-COVEIG-D{dimension}-FIT-{fitScopeId}-v1.0.0
    formula: y=B^T*log(x), where B=V*Q and Q are covariance eigenvectors in descending order
    basisFitScope: separately and explicitly fit within each fixture or pooled-dimension diagnostic group
    signRule: make the largest-absolute loading in each basis vector positive; ties use earliest component
    eigenvalueTieRule: retain NumPy eigh order after stable descending index sort and report near ties explicitly
    dimensionRule: D-1
    role: REGISTRY_ADVERSARIAL_COORDINATE_CONTROL
    inverseRule: close(exp(B*y))
    caveat: data-adaptive validation branch; never an author default or cross-fixture fixed basis

featureLayout:
  validationConfiguration: observations_as_rows_components_as_columns_no_extra_scaling
  evidenceClass: VALIDATION_ONLY_DOES_NOT_RESOLVE_REGISTRY_E01_A032
  registrySentinelPreserved: UNRESOLVED::E01-A032

invalidTransformPolicy:
  validationConfiguration: >-
    Emit exactly one status-bearing record per input observation and complete
    zero-treatment/coordinate specification. Reject negative or nonfinite input at the
    fixture boundary. Mark mathematically undefined rows INELIGIBLE with a machine-readable
    reason. Never delete, impute, or relabel such rows as drift.
  evidenceClass: VALIDATION_ONLY_DOES_NOT_RESOLVE_REGISTRY_E01_A033
  registrySentinelPreserved: UNRESOLVED::E01-A033

diagnostics:
  evaluationScopes: [each_fixture, pooled_by_dimension]
  zeroFrequency:
    outputs: [zero_component_count, zero_component_fraction, any_zero, zero_sum]
  finiteValues:
    rule: every eligible closed composition and coordinate must be finite
  covariance:
    centered: true
    divisor: n-1
    numericalRankTolerance: max(n,p)*machine_epsilon*largest_singular_value
    conditionThreshold: 1.0e12
    outputs:
      - eligible_observation_count
      - coordinate_dimension
      - covariance_rank
      - expected_max_rank
      - condition_number_raw
      - effective_nonzero_subspace_condition_number
      - covariance_readiness_status
  inverseTransform:
    absoluteTolerance: 1.0e-12
    relativeTolerance: 1.0e-12
    outputs: [maximum_absolute_error, maximum_relative_error, closure_error]
  representationAgreement:
    pairwiseDistanceVector: strict_upper_triangle_common_eligible_rows
    requiredIsometries:
      - full_clr_vs_ilr_max_absolute_distance_error_at_most_1e-12
      - ilr_vs_principal_log_ratio_max_absolute_distance_error_at_most_1e-12
    droppedClrDiagnostics:
      - every_component_is_materialized
      - inverse_compositions_agree_with_input
      - Pearson_and_Spearman_distance_agreement_with_ILR_are_reported_not_forced_to_one
    adversarialControls:
      - raw_vs_ilr_distance_Pearson_and_Spearman
      - Hellinger_vs_ilr_distance_Pearson_and_Spearman
  replacementAgreement:
    outputs:
      - additive_vs_multiplicative_Aitchison_distance_by_delta_and_observation
      - positive_part_ratio_preservation_for_multiplicative_replacement
      - strictly_positive_row_no_change_under_multiplicative_replacement

acceptanceRules:
  transformStatus: >-
    ACCEPTED_WITH_EXPLICIT_ELIGIBILITY_DOMAIN only when row coverage is complete,
    every eligible value is finite, every null result has a reason, and all applicable
    inverse checks pass. A mathematically declared ineligible row is not a hidden deletion.
  covarianceStatus: >-
    Covariance readiness is separate from transform validity. Full CLR is explicitly
    STRUCTURALLY_SINGULAR_FULL_CLR. Other branches are READY only when observed rank equals
    coordinate dimension and raw condition number is at most 1e12; otherwise report
    INSUFFICIENT_ELIGIBLE_ROWS, SAMPLE_RANK_DEFICIENT, or ILL_CONDITIONED without repair.
  outcomeClassification:
    supportive: all transform specifications meet their declared domain, row coverage, finite-value, inverse, and schema gates
    constrainingOrContradictory: any branch requires hidden row deletion/defaulting or fails an applicable numerical gate
    null: validated observations are insufficient to evaluate any zero-containing branch despite correct status handling

serialization:
  schemaVersion: E01-S09-transform-output-schema-v1.0.0
  canonicalSerialization: E01-canonical-json-v1.0.0
  binary64Encoding: canonical Python float.hex strings
  checksum: SHA-256 over canonical payload bytes
  roundTripCriterion: schema-conformant checksum-protected bytes reproduce exactly

failureInjections:
  - NEGATIVE_INPUT_REJECTED
  - NONFINITE_INPUT_REJECTED
  - RAW_REGISTRY_SENTINEL_REJECTED_AS_EXECUTABLE_SPECIFICATION
  - LOG_RATIO_ZERO_WITHOUT_REPLACEMENT_REMAINS_INELIGIBLE_NOT_INFINITE
  - NONORTHONORMAL_ILR_BASIS_REJECTED
  - HIDDEN_ROW_DELETION_DETECTED
  - CORRUPTED_INVERSE_DETECTED
  - TAMPERED_CHECKSUM_REJECTED

validationGates:
  - Every frozen input hash matches before execution.
  - Registry v0.3.0 remains byte-identical and all eight S09-owned values and statuses remain unchanged.
  - All 43 observations receive a status-bearing output under every applicable complete specification.
  - The six additive and six matched-delta multiplicative treatments are all materialized; no delta is selected as primary.
  - Every dropped-component CLR choice is materialized for dimensions 2 and 4.
  - Every eligible output is finite and every ineligible output has a machine-readable reason.
  - All applicable inverse transforms meet 1e-12 absolute and relative tolerances.
  - Helmert and principal-log-ratio bases are orthonormal and orthogonal to the all-ones vector.
  - Full CLR and ILR pairwise distances agree within 1e-12; ILR and principal-log-ratio distances agree within 1e-12.
  - Zero frequency, eligibility, covariance rank, conditioning, representation agreement, and inverse diagnostics are complete for fixture and pooled scopes.
  - Transform arrays conform to Draft 2020-12 schema, verify checksums, and round-trip byte-exactly.
  - All failure injections are detected.
  - S10 remains absent.

