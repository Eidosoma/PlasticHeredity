    - mappingId: E01-S10-PARTMAP-GROUP-MEAN-v1.0.0
      formula: arithmetic_mean_of_named_component_series_per_part
      scaling: downstream_phyid_sample_sd_normalization
      status: VALIDATION_ONLY_NOT_AUTHOR_MAPPING
    - mappingId: E01-S10-PARTMAP-PC1-v1.0.0
      formula: first_principal_component_score_per_part_after_componentwise_centering
      signRule: largest_absolute_loading_positive_ties_earliest_component
      eigenTiePolicy: RETAIN_INELIGIBLE_IF_LEADING_EIGENGAP_AT_MOST_1e-10_RELATIVE
      status: VALIDATION_ONLY_NOT_AUTHOR_MAPPING
    - mappingId: E01-S10-PARTMAP-OMEGA-EQUAL-WIDTH-VECTOR-v1.0.0
      formula: each_part_is_one_vector_variable_with_original_components_as_features
      domain: balanced_equal_width_bipartitions_only
      status: OMEGAID_ONLY_VALIDATION_BRANCH_NOT_AUTHOR_MAPPING
    - mappingId: UNRESOLVED::E01-A043::AUTHOR_PARTITION_MAPPING
      status: PRESERVED_UNRESOLVED
  objectiveBranches:
    - objectiveId: E01-S10-MIB-OBJ-SYNCHRONOUS-GAUSSIAN-MI-v1.0.0
      formula: I(partA_t;partB_t)
      status: VALIDATION_ONLY_MUTUAL_INFORMATION_CUT
    - objectiveId: E01-S10-MIB-OBJ-BIDIRECTIONAL-LAGGED-GAUSSIAN-MI-v1.0.0
      formula: I(partA_t;partB_t_plus_1)+I(partB_t;partA_t_plus_1)
      status: VALIDATION_ONLY_CAUSAL_CUT_PROXY
    - objectiveId: E01-S10-MIB-OBJ-ABS-PAPER-EQUATION-AGGREGATE-v1.0.0
      formula: abs(I_xytab-I_xtab-I_ytab)
      status: VALIDATION_ONLY_EQUATION_SENSITIVITY_NOT_SOURCE_RECOVERED_MIB
    - objectiveId: UNRESOLVED::E01-A054::SOURCE_RECOVERED_OBJECTIVE
      status: PRESERVED_UNRESOLVED
  normalizationBranches:
    - normalizationId: E01-S10-MIB-NORM-NONE-v1.0.0
      formula: objective
    - normalizationId: E01-S10-MIB-NORM-MIN-PART-ENTROPY-v1.0.0
      formula: objective/min(H(partA_t),H(partB_t))
      invalidPolicy: INELIGIBLE_IF_DENOMINATOR_NOT_FINITE_OR_NOT_POSITIVE
    - normalizationId: E01-S10-MIB-NORM-GEOMETRIC-PART-SIZE-v1.0.0
      formula: objective/sqrt(number_components_A*number_components_B)
    - normalizationId: UNRESOLVED::E01-A055::SOURCE_RECOVERED_NORMALIZATION
      status: PRESERVED_UNRESOLVED
  searchBranches:
    - searchId: E01-S10-MIB-SEARCH-EXHAUSTIVE-ALL-v1.0.0
      rule: enumerate_every_nonempty_unordered_bipartition_with_component_0_in_part_A
      tieRule: smallest_normalized_objective_then_lexicographic_part_A
    - searchId: E01-S10-MIB-SEARCH-EXHAUSTIVE-BALANCED-v1.0.0
      rule: exhaustive_all_restricted_to_absolute_part_size_difference_at_most_1
      tieRule: smallest_normalized_objective_then_lexicographic_part_A
    - searchId: E01-S10-MIB-SEARCH-SPECTRAL-FIXED-CANDIDATE-v1.0.0
      rule: >-
        Build absolute Pearson-correlation adjacency with zero diagonal, use the
        normalized-Laplacian Fiedler vector, orient its largest-absolute entry
        positive with earliest-index ties, and split by sign; zeros go to part A.
      failurePolicy: RETAIN_EIGENTIE_OR_EMPTY_PART_AS_INELIGIBLE
    - searchId: E01-S10-MIB-SEARCH-GREEDY-SINGLE-FLIP-v1.0.0
      rule: >-
        Start part A={0}; repeatedly accept the strictly best single-component
        move preserving nonempty parts; ties use lexicographic resulting part A;
        stop when improvement is at most 1e-12.
    - searchId: UNRESOLVED::E01-A056::QUEYRANNE
      status: NOT_IMPLEMENTED_NOT_PROVEN_SUBMODULAR_FOR_CANDIDATE_OBJECTIVES
    - searchId: UNRESOLVED::E01-A056::AUTHOR_SEARCH
      status: PRESERVED_UNRESOLVED

comparisonGates:
  gateVersion: E01-S10-comparison-gates-v1.0.0
  frozenBeforeOutcomes: true
  sourceMatlabFixture:
    branches: [gaussian_MMI, gaussian_CCS, discrete_MMI, discrete_CCS]
    localArrayAbsoluteTolerance: 1.0e-8
    localArrayRelativeTolerance: 1.0e-5
    meanArrayAbsoluteTolerance: 1.0e-8
    meanArrayRelativeTolerance: 1.0e-5
    rule: all_four_branches_must_pass_in_native_source_units
  latticeClosure:
    meanAbsoluteTolerance: 1.0e-10
    rule: sum_16_atoms_equals_I_xytab_and_equation_aggregate_matches_direct_formula
  independentGaussian:
    ensembleMeanAbsoluteTotalMiNats: 0.002
    ensembleMaximumAbsoluteAtomMeanNats: 0.002
    everyReplicateAbsoluteTotalMiNats: 0.01
  exactDiscreteTheory:
    ensembleMaximumAbsoluteAtomErrorNats: 0.01
    perReplicateMaximumAbsoluteAtomErrorNats: 0.04
    minimumPassingReplicates: 15
    dominantAtomMinimumFractionOfTheoreticalTotal: 0.95
  gaussianMmiPopulationTheory:
    ensembleMaximumAbsoluteAtomErrorNats: 0.015
    perReplicateMaximumAbsoluteAtomErrorNats: 0.05
    minimumPassingReplicates: 15
  qualitative:
    redundantGaussianMinimumPassingReplicates: 15
    coupledDirectionMinimumPassingReplicates: 15
    xorAndRedundantDiscreteMinimumPassingReplicates: 15
  timeShuffle:
    shuffledAbsoluteTotalMiNats: 0.01
    shuffledToOriginalTotalMiRatioMaximum: 0.10
    minimumPassingReplicates: 15
  affineAndScaleInvariance:
    meanAbsoluteTolerance: 1.0e-10
    meanRelativeTolerance: 1.0e-10
    rule: every_eligible_estimator_redundancy_control_must_pass
  referenceVsOmegaCpu:
    eligibleScope: 2x2_full_rank_or_supported_binary_only
    localAbsoluteTolerance: 1.0e-10
    localRelativeTolerance: 1.0e-10
    meanAbsoluteTolerance: 1.0e-10
    meanRelativeTolerance: 1.0e-10
  omegaCpuVsGpu:
    eligibleScope: 2x2_full_rank_or_supported_binary_only
    localAbsoluteTolerance: 1.0e-10
    localRelativeTolerance: 1.0e-10
    meanAbsoluteTolerance: 1.0e-10
    meanRelativeTolerance: 1.0e-10
  mibRecovery:
    primaryBranch:
      mappingId: E01-S10-PARTMAP-GROUP-MEAN-v1.0.0
      objectiveIds:
        - E01-S10-MIB-OBJ-SYNCHRONOUS-GAUSSIAN-MI-v1.0.0
        - E01-S10-MIB-OBJ-BIDIRECTIONAL-LAGGED-GAUSSIAN-MI-v1.0.0
        - E01-S10-MIB-OBJ-ABS-PAPER-EQUATION-AGGREGATE-v1.0.0
      normalizationId: E01-S10-MIB-NORM-NONE-v1.0.0
      searchId: E01-S10-MIB-SEARCH-EXHAUSTIVE-ALL-v1.0.0
      requiredPlantedRecoveries: 8
      totalReplicates: 8
    approximationGate:
      rule: >-
        A spectral or greedy branch is eligible only for validation/sensitivity
        if it returns the same partition and objective value as exhaustive search
        in all eight planted-system replicates for the same mapping, objective,
        and normalization. Failure remains reported and makes that branch ineligible.
  failureInjection:
    requiredDetected: 10
    total: 10
  overallPassRule: >-
    Reference source-fixture parity, lattice closure, theoretical systems,
    qualitative systems, controls, strict failure handling, and every applicable
    cross-backend comparison must pass its frozen gate. A failed optional branch
    is retained and classified ineligible; it may not be hidden by an aggregate pass.

failureInjections:
  - {injectionId: FI01, fault: unresolved_estimator_sentinel, expected: reject_before_estimation}
  - {injectionId: FI02, fault: unknown_atom_or_aggregate_mapping, expected: reject_configuration}
  - {injectionId: FI03, fault: exact_copy_gaussian_singular_covariance, expected: retain_ineligible_strict}
  - {injectionId: FI04, fault: hidden_nonfinite_row_deletion_request, expected: reject_policy}
  - {injectionId: FI05, fault: discrete_bits_mislabeled_as_nats, expected: unit_audit_failure}
  - {injectionId: FI06, fault: cpu_gpu_mean_perturbed_above_tolerance, expected: comparison_failure}
  - {injectionId: FI07, fault: noncanonical_partition_complement_or_tie, expected: canonicalization_failure}
  - {injectionId: FI08, fault: time_shuffle_without_permutation_identity, expected: provenance_failure}
  - {injectionId: FI09, fault: omega_svd_regularization_labeled_strict, expected: branch_identity_failure}
  - {injectionId: FI10, fault: frozen_input_or_output_checksum_tamper, expected: checksum_failure}

reportingContract:
  retainEveryCombination: true
  retainFailedAndIneligible: true
  requiredTables:
    - benchmark_cases.csv
    - atom_results.csv
    - theoretical_comparisons.csv
    - invariance_results.csv
    - backend_comparisons.csv
    - mib_partition_results.csv
    - eligibility_registry.csv
  requiredJson:
    - preregistration_record.json
    - validation_summary.json
    - failure_injection.json
    - source_traceability.json
    - registry_preservation.json
    - artifact_manifest.json
  requiredFigures:
    - synthetic_atom_profiles.png
    - backend_agreement.png
    - mib_recovery.png
  requiredBundleContracts:
    - information_dynamics_contract_v1.0.0.yaml
    - information_dynamics_eligibility_registry_v1.0.0.yaml
  classificationRule: >-
    Supportive only if the preregistered reference gates pass and at least one
    optional accelerated path satisfies every applicable cross-check. Otherwise
    report null or constraining/contradictory according to the failed boundary.

s11EligibilityPolicy:
  rule: >-
    Eligibility is branch-specific. Passing a synthetic gate does not resolve an
    author sentinel or choose a paper-primary method. A branch must retain estimator,
    redundancy, aggregate, partition mapping, objective, normalization, search,
    preprocessing, precision, and sample-gate identities in every S11 record.
  preprocessingBoundary: >-
    S09 accepted transform specifications are numerical candidates only. Full CLR
    and raw closed proportions retain structural covariance singularity; every
    other transform still requires the S10 per-window strict sample gate.
  omegaMultivariateBoundary: >-
    OmegaID equal-width vector parts are validation-only and cannot represent an
    arbitrary unbalanced 99-component bipartition. The more-than-2x2 doublet path
    is not eligible as a silent substitute for the 16-atom PhiID lattice.
