      family: gaussian_local_entropy_sample_covariance
      implementation: pinned_phyid
      covariance: numpy_cov_ddof_1
      scaling: divide_each_series_by_sample_sd_ddof_1_without_mean_subtraction
      biasCorrection: none
      regularization: none
      singularPolicy: INELIGIBLE_STRICT_FAILURE
      unitsNative: nats
      role: CPU_REFERENCE
    - estimatorId: E01-S10-PHYID-DISCRETE-BINARY-v1.0.0
      family: empirical_binary_plugin
      implementation: pinned_phyid
      binarization: value_strictly_greater_than_own_sample_mean
      biasCorrection: none
      regularization: none
      unitsNative: bits
      unitsReported: nats_via_multiply_ln_2
      role: CPU_REFERENCE_SYNTHETIC_BINARY_ONLY
    - estimatorId: E01-S10-OMEGAID-2X2-GAUSSIAN-STRICT-GUARDED-v1.0.0
      family: gaussian_local_entropy_sample_covariance
      implementation: pinned_omegaid_2x2
      precondition: strict_full_rank_gate_passes_so_svd_plus_1e6_fallback_is_not_entered
      sourceFallback: SVD_singular_values_plus_1e-6
      fallbackStatus: SEPARATE_DIAGNOSTIC_NOT_REFERENCE_EQUIVALENT
      role: ACCELERATED_CANDIDATE_CPU_OR_GPU
    - estimatorId: E01-S10-OMEGAID-2X2-DISCRETE-BINARY-v1.0.0
      family: empirical_binary_plugin
      implementation: pinned_omegaid_2x2
      unitsNative: bits
      unitsReported: nats_via_multiply_ln_2
