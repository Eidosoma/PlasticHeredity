  paperPrimarySelectionForbidden: true
  noSilentDefaults: true
  paperEquationBoundary: >-
    The paper's printed scalar is I((X_t,Y_t);(X_t+1,Y_t+1)) minus
    I(X_t;(X_t+1,Y_t+1)) minus I(Y_t;(X_t+1,Y_t+1)). Algebra over the pinned
    phyid lattice makes this the signed aggregate str+stx+sty+sts-rtr-rtx-rty-rts.
    This is an equation-derived aggregate, not a source-named phyid atom and not
    evidence of the unavailable authors' implementation mapping.

