sampleGate:
  specificationId: E01-S10-SAMPLE-GATE-STRICT-v1.0.0
  effectiveSamples: raw_length_minus_tau
  minimumEffectiveSamples: 512
  minimumSamplesPerJointDimension: 20
  gaussianRequirements:
    - every_input_and_derived_value_finite
    - every_scalar_series_sample_sd_ddof_1_strictly_positive
    - complete_four_vector_sample_covariance_positive_definite
    - numerical_rank_equals_joint_dimension
    - condition_number_at_most_1e12
  rankTolerance: max(n_samples,joint_dimension)*binary64_epsilon*largest_singular_value
  discreteRequirements:
    - every_input_is_finite
    - both_binarized_states_observed_in_each_scalar_series
    - no_row_deletion
  failurePolicy: RETAIN_INELIGIBLE_CASE_WITH_MACHINE_READABLE_REASON
  sourceBoundary: VALIDATION_BRANCH_DOES_NOT_RESOLVE_E01-A058_AS_AUTHOR_POLICY

syntheticDesign:
  rawSampleCount: 32769
  effectiveSampleCountAtTau1: 32768
  primaryReplicates: 16
  crossBackendReplicates: 4
  mibReplicates: 8
  tau: 1
  systems:
    - systemId: E01-S10-SYS-INDEPENDENT-GAUSSIAN-v1.0.0
      family: independent_gaussian_white_noise
      equations: [x_t=epsilon_x_t, y_t=epsilon_y_t]
      innovations: independent_standard_normal
      expectedBehavior:
        totalLaggedMiNats: 0.0
        allPopulationAtomMeansNats: 0.0
        paperEquationAggregateNats: 0.0
      evaluatedRedundancies: [MMI, CCS]
      estimatorKinds: [gaussian]
    - systemId: E01-S10-SYS-REDUNDANT-DISCRETE-v1.0.0
      family: redundant_binary_markov_copies
      equations: [z_t_plus_1=z_t_xor_flip_t, x_t=z_t, y_t=z_t]
      flipProbability: 0.1
      stationaryInitialProbabilityOne: 0.5
      theoreticalLaggedMiNats: ln(2)+0.9*ln(0.9)+0.1*ln(0.1)
      expectedBehavior:
        dominantAtom: rtr
        otherAtomMeansNats: 0.0
        paperEquationAggregate: negative_theoretical_lagged_mi
      evaluatedRedundancies: [MMI, CCS]
      estimatorKinds: [discrete]
      strictGaussianStatus: INELIGIBLE_EXACT_COPY_SINGULAR
    - systemId: E01-S10-SYS-REDUNDANT-GAUSSIAN-v1.0.0
      family: noisy_redundant_gaussian_copies
      equations:
        - z_t_plus_1=0.9*z_t+epsilon_z_t
        - x_t=z_t+0.35*epsilon_x_t
        - y_t=z_t+0.35*epsilon_y_t
      innovations: mutually_independent_standard_normal
      expectedBehavior:
        totalLaggedMi: positive
        pastRedundancyGreaterThanPastSynergy: true
        rtr: positive
        paperEquationAggregate: negative
      evaluatedRedundancies: [MMI, CCS]
      estimatorKinds: [gaussian]
    - systemId: E01-S10-SYS-XOR-DISCRETE-v1.0.0
      family: xor_like_synergy
      equations:
        - x_t_plus_1=x_t_xor_y_t
        - y_t_plus_1=independent_fair_bit
      stationaryInitial: independent_fair_bits
      theoreticalLaggedMiNats: ln(2)
      expectedBehavior:
        dominantAtom: stx
        pastSynergyNats: ln(2)
        pastRedundancyNats: 0.0
        paperEquationAggregateNats: ln(2)
      evaluatedRedundancies: [MMI, CCS]
      estimatorKinds: [discrete]
    - systemId: E01-S10-SYS-COUPLED-AR-v1.0.0
      family: directional_bivariate_gaussian_var1
      stateOrder: [x, y]
      transitionMatrix: [[0.0, 0.0], [0.85, 0.25]]
      innovationStandardDeviations: [1.0, 0.5]
      burnIn: 4096
      expectedBehavior:
        totalLaggedMi: positive
        forwardCrossMi: I_xtb_positive
        reverseCrossMi: I_yta_population_zero
        directionGate: I_xtb_greater_than_I_yta
      evaluatedRedundancies: [MMI, CCS]
      estimatorKinds: [gaussian]
    - systemId: E01-S10-SYS-BLOCK-AR4-v1.0.0
      family: two_independent_redundant_gaussian_ar_blocks
      dimensions: 4
      equations:
        - latentA_t_plus_1=0.82*latentA_t+epsilon_A_t
        - latentB_t_plus_1=0.82*latentB_t+epsilon_B_t
        - components_0_1=latentA+0.20*independent_observation_noise
        - components_2_3=latentB+0.20*independent_observation_noise
      burnIn: 4096
      plantedPartition: [[0, 1], [2, 3]]
      expectedBehavior:
        exhaustiveUnnormalizedSynchronousMiMinimum: plantedPartition
        exhaustiveUnnormalizedBidirectionalLaggedMiMinimum: plantedPartition
        exhaustiveUnnormalizedAbsolutePaperEquationAggregateMinimum: plantedPartition
        spectralCandidate: plantedPartition

transformControls:
  gaussianAffine:
    controlId: E01-S10-CONTROL-GAUSSIAN-AFFINE-v1.0.0
    sourceTransform: x_prime=17*x+23
    targetTransform: y_prime=-0.125*y+5
    expectedBehavior: all_atom_and_intermediate_mi_means_invariant
  discreteRelabeling:
    controlId: E01-S10-CONTROL-DISCRETE-RELABEL-v1.0.0
    sourceTransform: x_prime=3*x+11
    targetTransform: y_prime=-2*y+7
    expectedBehavior: binarized_state_relabeling_preserves_all_mean_atoms
  timeShuffle:
    controlId: E01-S10-CONTROL-COMMON-TIME-PERMUTATION-v1.0.0
    rule: >-
      Apply one estimator-stream-derived permutation to complete contemporaneous
      observation rows, then reconstruct lag-one pairs. Preserve each same-time
      marginal and cross-sectional relationship while destroying serial order.
    expectedBehavior: structured_lagged_dependence_collapses_toward_zero

