frozenQuestion: >-
  Do the pinned phyid reference implementation and explicitly named OmegaID
  acceleration branches reproduce preregistered theoretical, qualitative, and
  invariance behavior on synthetic information-dynamic systems, while failing
  closed on unsupported inputs and preserving every author-method ambiguity?

