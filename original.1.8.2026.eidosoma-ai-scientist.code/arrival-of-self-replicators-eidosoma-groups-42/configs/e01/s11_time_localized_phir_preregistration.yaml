frozenQuestion: >-
  Can a separately named regularized Gaussian PhiID branch and an explicitly
  approximate high-dimensional partition branch pass preregistered validation at
  every planned fixed-window effective sample size, while the S10 strict branch
  remains unchanged and is used only at 512 or more effective samples?

scopeBoundary:
  currentStepOnly: S11
  nextStepForbidden: S12
  noGardBaselineOrInterventionRun: true
  fixedWindowScope: past-only sliding windows on validated synthetic fixtures
  expandingScope: S10 strict branch only when effectiveSampleCount >= 512
  wholeTrajectoryScope: descriptive and explicitly non-prospective
  noPaperPrimaryDesignation: true
  noSilentDefaults: true
  noAuthorOrMatlabIdentityClaim: true
  unavailableScientificInput: >-
    S12 has not generated an E01 GARD minimal-run trajectory. S11 therefore emits
    validated synthetic time-localized histories and executable contracts, not
    paper-claim or GARD-baseline estimates.

immutableS10Boundary:
  strictSampleGateId: E01-S10-SAMPLE-GATE-STRICT-v1.0.0
  minimumEffectiveSamples: 512
  action: DO_NOT_RELAX_RENAME_OR_BACKPORT
  fixedPairsEligibleUnderS10Strict: 0
  strictBackends:
    - E01-S10-PHYID-PINNED-GAUSSIAN-MMI-v1.0.0
    - E01-S10-PHYID-PINNED-GAUSSIAN-CCS-v1.0.0
    - E01-S10-OMEGAID-PINNED-GAUSSIAN-NUMPY-v1.0.0
    - E01-S10-OMEGAID-PINNED-GAUSSIAN-CUPY-v1.0.0
  exclusions:
    - branch: OmegaID discrete CPU/GPU
      reason: S10 binary relabel-invariance failure
    - branch: OmegaID more-than-2x2 doublet output
      reason: not the required 16-atom PhiID lattice

