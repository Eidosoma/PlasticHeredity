smallWindowEstimator:
  specificationId: E01-S11-PHIID-GAUSSIAN-OAS-CROSSFIT-v1.0.0
  relationshipToS10: DISTINCT_REGULARIZED_VALIDATION_BRANCH
  implementation:
    kind: Gaussian local-surprisal PhiID
    inputAfterPartitionMapping: two finite scalar time series
    laggedVectorOrder: [x_t, y_t, x_t_plus_tau, y_t_plus_tau]
    folds: 4
    foldAssignment: contiguous balanced folds over lagged-pair row indices
    evaluation: each row evaluated exactly once by a model trained on the other folds
    standardization: training-fold mean and sample standard deviation per variable
    covariance:
      estimator: Oracle Approximating Shrinkage
      estimatorId: E01-S11-COV-OAS-IDENTITY-v1.0.0
      empiricalNormalization: maximum-likelihood divisor n_train
      target: mu times identity where mu is trace(empiricalCovariance)/4
      shrinkageFormula: >-
        min((mean(S^2)+mu^2)/((n_train+1)*(mean(S^2)-mu^2/4)),1), with
        shrinkage 1 when the denominator is nonpositive
      sensitivityMultipliers: [0.5, 1.0, 1.5]
      canonicalMultiplier: 1.0
      sensitivityUse: validation only; no post-hoc branch replacement
    entropy: held-out negative log-density from every required covariance submatrix
    nativeUnits: nats
    rowsDeleted: 0
    precision: IEEE-754 binary64
  gate:
    minimumEffectiveSamples: 24
    minimumTrainingRowsPerFold: 18
    minimumEvaluationRowsPerFold: 6
    finiteInputRequired: true
    minimumSampleSd: 1.0e-12
    minimumRegularizedEigenvalue: 1.0e-10
    maximumRegularizedConditionNumber: 1.0e8
    maximumLatticeClosureAbsoluteError: 5.0e-10
    maximumEquationClosureAbsoluteError: 5.0e-10
    noFallback: true
  calibration:
    specificationId: E01-S11-NULL-CENTERING-EXACT-PAIR-v1.0.0
    method: subtract independent-calibration ensemble mean for every atom and intermediate MI
    keys: [pairId, redundancyId]
    calibrationReplicatesPerPair: 512
    heldOutNullReplicatesPerPair: 256
    calibrationAndValidationStreamsDisjoint: true
    uncertainty: percentile interval from held-out replicate distribution
    nullEnvelopeQuantile: 0.99
    preserveRawAndCalibratedValues: true

redundancyBranches:
  - redundancyId: E01-S11-REDUNDANCY-MMI-v1.0.0
    name: MMI
    interpretation: local array selected by the lower ensemble-mean mutual information
    evidenceClass: source-traceable formula reconstructed under the new estimator
  - redundancyId: E01-S11-REDUNDANCY-CCS-EXPERIMENTAL-v1.0.0
    name: CCS
    interpretation: sign-filtered local common change in surprisal
    evidenceClass: experimental sensitivity branch; pinned phyid source says To be implemented

atomAndAggregateContract:
  nativeAtomIds: [rtr, rtx, rty, rts, xtr, xtx, xty, xts, ytr, ytx, yty, yts, str, stx, sty, sts]
  latticeSolveId: E01-S10-PHYID-16-ATOM-LINEAR-SOLVE-v1.0.0
  equationAggregateId: E01-S10-PAPER-EQUATION-DERIVED-AGGREGATE-v1.0.0
  equationAggregateFormula: str+stx+sty+sts-rtr-rtx-rty-rts
  equationDirectFormula: I_xytab-I_xtab-I_ytab
  sourceNamingBoundary: equation-derived aggregate is not relabeled as a source-named atom
  outputPolicy: emit all raw and calibrated atoms, intermediate MIs, aggregate, and closure diagnostics

partitionBranch:
  affinityId: E01-S11-PARTITION-AFFINITY-ABS-CORR-LAG-v1.0.0
  searchId: E01-S11-MIB-SEARCH-STABILITY-SPECTRAL-SINGLE-FLIP-v1.0.0
  implementation:
    componentStandardization: window-local mean and sample standard deviation
    adjacency: >-
      mean of absolute contemporaneous correlation and the two absolute directed
      lagged correlations; diagonal set to zero
    bootstrap:
      method: Bayesian exponential row weights on lag-aligned rows
      primaryReplicates: 8
      stabilityAuditReplicates: 16
      zeroWeightOrRowDeletion: forbidden
    initialPartition: normalized-Laplacian Fiedler split for base and each bootstrap adjacency
    consensus: normalized-Laplacian split of the co-assignment matrix
    candidateSet: base, bootstrap, consensus, and every canonical single-component flip of consensus
    canonicalization: component zero belongs to part A; complement duplicates removed
    selection: minimum normalized objective then lexicographic part-A tuple
  eligibilityGate:
    minimumPartFraction: 0.10
    minimumMeanPairwiseBootstrapAri: 0.75
    minimumConsensusConfidence: 0.85
    minimumWithinMinusBetweenAffinity: 0.20
    minimumRelativeFiedlerEigengap: 0.05
    allCandidateScoresFinite: true
    noFallbackPartition: true
  representativeDimensions:
    - {dimension: 99, plantedPartSizes: [49, 50], context: dropped-CLR-or-ILR-sized E01 coordinate stress test}
    - {dimension: 100, plantedPartSizes: [50, 50], context: full-component E01 stress test}
  partitionMappings:
    - mappingId: E01-S11-PARTMAP-ZSCORE-GROUP-MEAN-v1.0.0
      name: zscore_group_mean
      outputWidths: [1, 1]
    - mappingId: E01-S11-PARTMAP-ZSCORE-PC1-v1.0.0
      name: zscore_pc1
      outputWidths: [1, 1]
      signRule: largest-absolute-loading pivot positive; lowest index breaks ties
      eigengapGate: 1.0e-8
    - mappingId: E01-S10-PARTMAP-OMEGA-EQUAL-WIDTH-VECTOR-v1.0.0
      name: omega_equal_width_vector
      eligibility: equal part widths only
      use: strict Gaussian source cross-check only; more-than-2x2 doublet output excluded
  objectiveBranches:
    - {objectiveId: E01-S10-MIB-OBJ-SYNCHRONOUS-GAUSSIAN-MI-v1.0.0, name: synchronous_mi}
    - {objectiveId: E01-S10-MIB-OBJ-BIDIRECTIONAL-LAGGED-GAUSSIAN-MI-v1.0.0, name: bidirectional_lagged_mi}
    - {objectiveId: E01-S10-MIB-OBJ-ABS-PAPER-EQUATION-AGGREGATE-v1.0.0, name: abs_paper_equation}
  normalizationBranches:
    - {normalizationId: E01-S10-MIB-NORM-NONE-v1.0.0, name: none}
    - {normalizationId: E01-S10-MIB-NORM-MIN-PART-ENTROPY-v1.0.0, name: min_part_entropy}
    - {normalizationId: E01-S10-MIB-NORM-GEOMETRIC-PART-SIZE-v1.0.0, name: geometric_part_size}
  uncertaintyPolicy: every mapping/objective/normalization combination remains a separate sensitivity branch

syntheticSystems:
  scalar:
    - systemId: E01-S11-SYS-INDEPENDENT-WHITE-GAUSSIAN-v1.0.0
      truth: all atoms, mutual informations, and equation aggregate are zero
    - systemId: E01-S11-SYS-NOISY-REDUNDANT-AR-v1.0.0
      parameters: {latentAr: 0.80, latentInnovationSd: 1.0, observationSd: 0.35}
      truth: analytic lag-specific Gaussian MMI; quasi-Monte-Carlo population CCS
    - systemId: E01-S11-SYS-DIRECTIONAL-VAR-v1.0.0
      parameters:
        transition: [[0.10, 0.00], [0.75, 0.20]]
        innovationSd: [1.0, 0.5]
      truth: analytic lag-specific Gaussian MMI; quasi-Monte-Carlo population CCS
  highDimensional:
    - systemId: E01-S11-SYS-PLANTED-TWO-BLOCK-AR-v1.0.0
      parameters: {latentAr: 0.80, loading: 1.0, componentNoiseSd: 0.10, burnIn: 512}
      truth: planted 49x50 or 50x50 partition
    - systemId: E01-S11-SYS-HIGHDIM-INDEPENDENT-NULL-v1.0.0
      parameters: {componentAr: 0.20, burnIn: 512}
      truth: no privileged bipartition; partition branch must fail closed
    - systemId: E01-S11-SYS-PIECEWISE-BLOCK-AR-v1.0.0
      parameters: {length: 2048, dimension: 100, changePoint: 1024, burnIn: 512}
      truth: predeclared component-membership exchange at change point
  ccsOracle:
    method: scrambled Sobol draws transformed by the exact population covariance
    drawsPerScramble: 262144
    independentScrambles: 2
    maximumCrossScrambleAtomDifference: 0.002
    use: validation reference only

sampleSizes:
  scalarKnownTruthReplicatesPerPairPerSystem: 256
  highDimensionalSignalReplicatesPerPairPerDimension: 16
  highDimensionalNullReplicatesPerPairPerDimension: 16
  smallDimensionExactSearchReplicates: 64
  smallDimension: 8
  invarianceReplicatesPerPair: 8
  shuffleReplicatesPerPairPerStructuredSystem: 128

validationGates:
  multipleTestingPolicy: all gates are simultaneous engineering acceptance gates; no outcome-selected branch substitution
  nullCalibration:
    maximumAbsoluteHeldOutMeanPerAtom: 0.040
    maximumAbsoluteHeldOutMeanEquationAggregate: 0.040
    maximumHeldOutFalsePositiveRateAgainstCalibration99PercentEnvelope: 0.050
  gaussianMmiKnownTruth:
    maximumAbsoluteEnsembleTotalMiError: 0.20
    maximumAbsoluteEnsembleEquationAggregateError: 0.20
    maximumAtomRootMeanSquareError: 0.20
    requiredDirectionalSigns: true
  gaussianCcsKnownTruth:
    maximumPopulationOracleCrossScrambleDifference: 0.002
    maximumAbsoluteEnsembleTotalMiError: 0.20
    maximumAbsoluteEnsembleEquationAggregateError: 0.25
    maximumAtomRootMeanSquareError: 0.25
    experimentalLabelRequired: true
  regularization:
    everyOasCovariancePositiveDefinite: true
    maximumMedianAbsoluteEquationChangeAcrossSensitivityMultipliers: 0.15
    singularFailureInjectionMustFailWithoutOasAndPassWithOas: true
  plantedPartition:
    minimumEligibleReplicatesPer16: 15
    minimumMedianAdjustedRandIndex: 0.95
    minimumExactPlantedRecoveryFraction: 0.875
  nullPartition:
    maximumEligibleReplicatesPer16: 1
    numericPhiEstimateCount: 0
  approximation:
    minimumExactSearchAgreementFractionAtDimension8: 0.90
    minimumMedianPrimaryVsAuditBootstrapAri: 0.95
    minimumMedianObjectiveWinnerAriAcrossRepeat: 0.90
  invariance:
    scalarAffineMaximumAbsoluteDifference: 1.0e-9
    scalarRelabelMaximumMappedAtomDifference: 1.0e-9
    featureRelabelMinimumPartitionAri: 1.0
    positiveFeatureAffineMinimumPartitionAri: 1.0
  shuffle:
    minimumFractionInsideHeldOutNull99PercentEnvelope: 0.95
  reproducibility:
    exactCpuRepeat: true
    exactSeedManifestRepeat: true
    exactCausalityIndexAudit: true
  cpuGpu:
    branch: E01-S11-PHIID-GAUSSIAN-OAS-CROSSFIT-v1.0.0
    devices: [numpy_cpu, cupy_gpu]
    dtype: float64
    maximumAbsoluteAtomOrAggregateDifference: 1.0e-9
    maximumRelativeDifference: 1.0e-8
  closure:
    maximumAbsoluteLatticeError: 5.0e-10
    maximumAbsoluteEquationError: 5.0e-10

pairEligibilityRule: >-
  A fixed pair is eligible separately for each redundancy, mapping, objective, and
  normalization identity only if its exact-size estimator gates, planted and null
  high-dimensional gates at dimensions 99 and 100, approximation, invariance,
  shuffle, reproducibility, causality, closure, and CPU/GPU gates all pass. Failed
  combinations retain a status and reason but contain no numeric PhiID estimate.

temporalEvaluation:
  windowDefinition: inclusive rows [end-windowLength+1, end]
  lagPairs: past row s and future row s+lag, both inside the window
  requiredIndexFields: [windowStart, windowEnd, pastIndexMin, pastIndexMax, futureIndexMin, futureIndexMax]
  prospectiveGate: futureIndexMax <= windowEnd
  slidingHistory:
    fixture: E01-S11-SYS-PIECEWISE-BLOCK-AR-v1.0.0
    endpoints: first complete window, then every floor(windowLength/2) rows, and final row
  expandingHistory:
    estimator: S10 strict pinned phyid Gaussian only
    effectiveSampleCheckpoints: [512, 1024]
    condition: each requested lag must satisfy the unchanged strict sample/covariance gate
  wholeTrajectory:
    estimator: S10 strict pinned phyid Gaussian only
    prospective: false
    label: NON_PROSPECTIVE_WHOLE_TRAJECTORY_DESCRIPTION
  selectedPartitionAtEveryEvaluation: required

preprocessingBoundary:
