smallWindowEstimator:
  specificationId: E01-S11R-PHIID-GAUSSIAN-WISHART-LOCAL-v1.0.0
  relationshipToS11: DISTINCT_ESTIMATOR; DOES_NOT_REPLACE_OR_REINTERPRET_S11
  implementation:
    inputAfterPartitionMapping: two finite scalar time series
    laggedVectorOrder: [x_t, y_t, x_t_plus_tau, y_t_plus_tau]
    standardization: full-lagged-sample mean and sample standard deviation per variable
    covariance: unbiased sample covariance with divisor n_eff-1
    regularization: none
    localEntropy: in-sample Gaussian negative log density for every required covariance submatrix
    finiteSampleCorrection: >-
      For subset dimension p and nu=n_eff-1, add
      0.5*(p/n_eff - (sum_i=1^p digamma((nu+1-i)/2) + p*log(2) - p*log(nu)))
      to every local entropy row. This exactly removes the Gaussian Wishart mean
      log-determinant and in-sample quadratic-form bias under the declared model.
    nativeUnits: nats
    precision: IEEE-754 binary64 CPU
    rowsDeleted: 0
    noFallback: true
  gate:
    minimumEffectiveSamples: 24
    finiteInputRequired: true
    minimumSampleSd: 1.0e-12
    covariancePositiveDefinite: true
    minimumCovarianceEigenvalue: 1.0e-10
    maximumCovarianceConditionNumber: 1.0e8
    maximumLatticeClosureAbsoluteError: 5.0e-10
    maximumEquationClosureAbsoluteError: 5.0e-10

conditionMatchedNull:
  specificationId: E01-S11R-NULL-CONDITION-MATCHED-COMPLETE-ROW-SHUFFLE-v1.0.0
  construction: >-
    Generate an independent replicate from the same declared synthetic system at
    the exact window length, apply one uniformly random permutation to complete
    contemporaneous source-target rows before lagging, and evaluate with the exact
    pair and estimator. This preserves the system-specific instantaneous joint
    condition while destroying ordered lag structure.
  keys: [phase, pairId, systemId, redundancyId]
  centering: subtract the calibration-bank mean for every atom and intermediate MI
  envelope: 99th percentile of absolute centered paper-equation aggregate using method=higher
  calibrationAndEvaluationStreamsDisjoint: true
  preserveRawAndCalibratedValues: true
  noIndependentWhiteSubstitutionForStructuredSystems: true

