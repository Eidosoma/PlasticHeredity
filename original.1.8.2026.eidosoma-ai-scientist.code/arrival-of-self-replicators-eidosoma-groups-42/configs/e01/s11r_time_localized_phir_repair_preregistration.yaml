partitionBranch:
  affinityId: E01-S11R-PARTITION-AFFINITY-LAG-ALIGNED-ABS-CORR-v1.0.0
  searchId: E01-S11R-PARTITION-THRESHOLD-COMPONENTS-v1.0.0
  relationshipToS11: DISTINCT_PERMUTATION_EQUIVARIANT_BRANCH; S11_SPECTRAL_FAILURES_REMAIN
  implementation:
    componentStandardization: pair-local sample mean and sample standard deviation
    affinity: mean of absolute Pearson correlation among past rows and among future rows for the exact lag alignment
    edgeThreshold: 0.90
    thresholdTieTolerance: 1.0e-12
    graphRule: undirected edge iff affinity is strictly above threshold; any edge within tolerance of threshold is ineligible
    basePartition: exactly two connected components; otherwise ineligible
    bootstrap:
      method: Bayesian exponential weights on the exact lagged-pair rows
      replicates: 8
      rule: every bootstrap must also yield exactly two components
    permutationEquivariance: >-
      Affinity, threshold graph, connected-component membership, and ARI comparison
      commute with arbitrary feature permutations. Part labels are unordered and no
      feature index is used to resolve a graph or objective tie.
    noFallback: true
  eligibilityGate:
    minimumPartFraction: 0.10
    minimumMeanBootstrapAri: 0.75
    minimumWithinAffinity: 0.90
    minimumWithinMinusMaximumBetweenAffinity: 0.10
    allValuesFinite: true
  exhaustiveDimension8:
    oracleSearch: every nonempty unordered bipartition with component zero in part A
    comparisonGrid:
      mappings: [zscore_group_mean, zscore_pc1]
      objectives: [synchronous_mi, bidirectional_lagged_mi, abs_paper_equation]
      normalizations: [none, min_part_entropy, geometric_part_size]
    agreementMetric: selected unordered partition equality / adjusted Rand index 1
    tiePolicy: exhaustive objective ties within 1.0e-12 are ineligible; no index-based winner
  representativeDimensions:
    - {dimension: 8, plantedPartSizes: [4, 4]}
    - {dimension: 99, plantedPartSizes: [49, 50]}
    - {dimension: 100, plantedPartSizes: [50, 50]}
  mappings:
