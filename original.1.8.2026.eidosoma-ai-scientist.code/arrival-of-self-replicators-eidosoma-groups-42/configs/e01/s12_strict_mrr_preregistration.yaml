    method: additive_pseudocount
    delta: 0.5
    deltaHex: 0x1.0000000000000p-1
    closure: divide_by_exact_row_sum_after_addition
    evidenceClass: FROZEN_S09_VALIDATION_GRID_MEMBER_NOT_AUTHOR_DEFAULT
  branches:
    - preprocessingId: E01-S12-PREPROC-ADD0p5-DROPCLR-D100-C100-v1.0.0
      coordinateFamily: dropped_clr
      inputDimension: 100
      outputDimension: 99
      droppedOriginalComponentOneBased: 100
      logBase: natural
      inverseValidation: reconstruct_full_composition_then_forward_transform
      evidenceClass: VERSIONED_S12_EXTENSION_OF_S09_TRANSFORM_NOT_AUTHOR_DEFAULT
    - preprocessingId: E01-S12-PREPROC-ADD0p5-ILR-HELMERT-D100-v1.0.0
      coordinateFamily: ilr_helmert
      inputDimension: 100
      outputDimension: 99
