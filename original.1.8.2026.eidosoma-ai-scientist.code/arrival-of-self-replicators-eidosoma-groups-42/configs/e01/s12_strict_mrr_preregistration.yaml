gardSpecification:
  specificationId: E01-S12-GARD-HISTORICAL-SOURCE-TRACEABLE-SCALE-v1.0.0
  engineId: E01-GARD-INDEPENDENT-v1.0.0
  engineImplementation: e01_gard_independent
  evidenceBoundary: >-
    Explicit full-scale reconstruction of pinned public historical GARD behavior
    through the independently written and S07-validated engine. It is neither
    the unavailable author implementation nor an assertion that the paper used
    these public historical defaults. Conflicts with paper prose remain visible.
  nSpecies: 100
  nMin: 40
  nMax: 80
  nGenerations: 100
  maxSteps: null
  betaA: -4.0
  betaSigma: 4.0
  kF: 0.01
  kB: 0.0001
  rho: uniform_exact_1_over_100
  propensityEquationBranch: historical_reference
  catalyticMatrixBranch: historical_orientation_with_diagonal
  reservoirSemantics: constant_require_sum_one
  updateKernel: categorical_single_event
  clockSemantics: event_index_only
  poissonExposure: null
  lossNonnegativity: eventwise_zero_rate
  growthBoundary: eventwise_exact_stop
  maxStepsSemantics: unbounded_historical_comparison
  zeroPropensitySemantics: raise_and_retain_failure
  fissionSemantics: fixed_size_without_replacement_odd_discard
  fissionProbability: null
  daughterSelection: first
  postFissionSemantics: continue_exact_selected
  initialStateSemantics: with_replacement_counts
  conflictsPreserved:
    paperPoissonVsHistoricalCategorical: CONFLICT::E01-A012
    paperBinomialVsHistoricalFixedSizeFission: CONFLICT::E01-A018
    paperDistinctInitialVsHistoricalWithReplacement: CONFLICT::E01-A021
    paperMaxStepsVsHistoricalNoMaxSteps: CONFLICT::E01-A015

