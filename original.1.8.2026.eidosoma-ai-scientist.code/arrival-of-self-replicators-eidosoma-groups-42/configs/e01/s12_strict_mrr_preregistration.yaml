    - local_spike_height_width_timing
    - events_before_first_eligible_time
    - early_warning_origin_before_eligibility
    - original_first_25_percent_to_final_75_percent_when_first_quarter_ineligible
    - interventions_before_first_eligible_post_fission_point
    - intervention_after_every_fission
    - exact_Figure_6
    - exact_Table_1
  restrictedAssociationRule:
    directionalSupportedOnlyIf:
      - all_numeric_and_replay_gates_pass
      - both_preprocessing_branches_have_same_positive_direction
      - at_least_9_of_12_defined_trajectory_statistics_are_positive
      - trajectory_bootstrap_95_percent_interval_excludes_zero
      - permutation_p_value_at_most_0.05
    notSupportedWithinStrictScopeOnlyIf: >-
      The post-eligibility estimand is adequately observed under both
      preprocessing branches and its preregistered interval excludes the
      directional effect or supports a null/reversed result. Never generalize
      this label to fixed-window, pre-eligibility, or early-time behavior.
    otherwise: UNDERDETERMINED
  interventionRule:
    directionalSupportedOnlyIf:
      - feasibility_gate_passed_and_six_triplets_completed
      - at_least_4_of_6_triplets_apply_at_least_3_separable_actions_per_noncontrol_condition
      - at_least_5_of_6_triplets_have_max_greater_than_control_and_control_greater_than_min_for_restricted_posteligibility_endpoint
      - paired_bootstrap_95_percent_intervals_for_both_contrasts_exclude_zero
      - both_preprocessing_action_branches_agree
    noTripletsBecauseFrozenGateFailed: UNDERDETERMINED
    sparseSuppressedActions: UNDERDETERMINED
    validRestrictedNull: NOT_SUPPORTED_WITHIN_STRICT_SCOPE
  supportedBoundary: >-
    SUPPORTED may be used only for a literal restricted S12 estimand whose point,
    interval, permutation, sensitivity, and provenance gates all pass; it may
    never imply exact author replication or restore unavailable paper scope.

