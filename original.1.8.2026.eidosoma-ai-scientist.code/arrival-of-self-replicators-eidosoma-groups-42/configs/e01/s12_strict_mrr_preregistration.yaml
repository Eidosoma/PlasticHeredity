replicatorLabels:
  samplingInput: selected_daughter_state_at_each_post_fission_generation
  branches:
    - labelId: E01-S08-YH-T1-HGT090-v1.0.0
      family: historical_non_drift_technique1
      threshold: 0.9
      comparator: strict_greater_than
      role: source_traceable_retrospective_label_not_author_identity
      prospectiveUse: outcome_only_not_predictor
    - labelId: E01-S08-YC-COS-HGT090-MIN3-ONLINE-v1.0.0
      family: cosine_threshold_graph_past_only
      threshold: 0.9
      comparator: strict_greater_than
      minimumClusterSize: 3
      role: validation_only_past_only_companion
  propagationToMolecularObservations: >-
    The label for generation g is attached to observations after fission g and
    before fission g+1. Initial-growth observations before the first fission have
    status LABEL_NOT_YET_DEFINED. Retrospective historical labels are outcomes,
    never prospective predictor inputs.
  noHiddenExclusion: true

associationAnalyses:
  analysisId: E01-S12-POSTELIGIBILITY-ASSOCIATION-v1.0.0
  evidenceBoundary: restricted_post_eligibility_estimands_only
  branches:
    - estimandId: continuing_replication
      unit: eligible_post_fission_decision_point
      predictor: strict_expanding_Phi_r_at_current_decision
      outcome: historical_non_drift_label_at_current_generation
      statistic: per_trajectory_Spearman_then_median_across_trajectories
    - estimandId: later_replication_one_generation
      unit: eligible_post_fission_decision_point_with_observed_next_generation
      predictor: strict_expanding_Phi_r_at_current_decision
      outcome: historical_non_drift_label_at_next_generation
      statistic: per_trajectory_point_biserial_Spearman_then_median_across_trajectories
    - estimandId: past_only_companion_continuing
      unit: eligible_post_fission_decision_point
      predictor: strict_expanding_Phi_r_at_current_decision
      outcome: past_only_cosine_label_at_current_generation
      statistic: per_trajectory_Spearman_then_median_across_trajectories
  uncertainty:
    trajectoryBootstrapReplicates: 4096
    confidenceLevel: 0.95
    seedPurpose: estimator
    interval: percentile
  nullControl:
    permutationsPerBranch: 4096
    method: independent_nonzero_circular_generation_shift_within_each_trajectory_then_recompute_summary
    minimumShift: 1
    pValue: plus_one_one_sided_for_positive_direction
  branchConcordance: both_preprocessing_branches_must_have_same_sign_for_directional_claim
  noFixedWindowInput: true

baselineFeasibilityGate:
  gateId: E01-S12-BASELINE-FEASIBILITY-INTERVENTION-v1.0.0
  frozenBeforeBaselineOutcomes: true
  allMustPass:
    exactBaselineTrajectoriesComplete: 12
    generationsPerTrajectoryExactly: 100
    exactReplayTrajectoriesRequired: 3
    replaySelectionMatrixIndices: [0, 5, 11]
    minimumQualifyingTrajectories: 6
    qualifyingTrajectoryRequirements:
      minimumEligiblePostFissionPointsUnderEachPreprocessing: 24
      bothPreprocessingPartitionsLocked: true
      finalObservationEligibleUnderEachPreprocessing: true
    finalMolecularCoverageAtLeastUnderEachPreprocessing: 0.75
    medianFirstEligibleGenerationAtMost: 25
    candidateScoringPilot:
      selection: first_eligible_post_fission_point_of_each_qualifying_trajectory
      minimumPilotsPassingCompleteCandidateStrictGatesAndExactReplay: 6
      completeCandidateSetRequired: true
    runtime:
      observedBaselineCpuHoursAtMost: 20.0
      projectedCompleteS12CpuHoursAtMost: 200.0
      projectedCompleteS12WallHoursAtMost: 48.0
      overallE01CpuCeilingHours: 250.0
      projectionUses: median_full_candidate_pilot_time_times_number_of_planned_decision_points_plus_observed_baseline
    storage:
      projectedS12BytesAtMost: 21474836480
      freeBytesMustExceedProjectionTimes: 1.25
  outcome:
    pass: run_exactly_six_triplets
    fail: run_zero_triplets_and_retain_every_gate_reason
  tripletSelectionOnPass: >-
    Sort qualifying baseline matrix indices ascending and select exactly the first
    six. No outcome statistic, effect direction, runtime convenience, or label
    prevalence may change selection or reduce six to a smaller positive count.

interventionDesign:
  specificationId: E01-S12-STRICT-POSTELIGIBILITY-INTERVENTION-v1.0.0
  conditions: [max, control, min]
  initialIdentityRule: >-
    All three conditions use the same matrix, initial state, and stochastic
    streams and remain state- and action-identical until the first eligible and
    separable post-fission action is actually applied.
  decisionPoints: post_fission_only
  firstPermittedPoint: first_post_fission_point_with_valid_strict_candidate_scoring_after_n_eff_512
  candidates:
    noop: unchanged_state
    additions: one_candidate_plus_one_for_each_of_100_species
    deletions: one_candidate_minus_one_for_each_species_with_positive_current_count
    fullSetRequired: true
  scoring:
    history: all_materialized_observations_available_through_current_post_fission_state
    hypotheticalAction: append_action_modified_state_as_one_hypothetical_next_observation
    partition: frozen_past_only_locked_partition_not_reestimated_per_candidate
    aggregate: E01-S10-AGG-PAPER-EQUATION-v1.0.0
    redundancyPolicy: direct_equation_score_is_redundancy_invariant_but_MMI_and_CCS_provenance_remain_distinct
    everyCandidateMustPassBothPreprocessingStrictGates: true
    fallbackScoreForbidden: true
    ineligibleScore: null
  actionConsensus:
    requireSameUniqueWinningActionAcrossBothPreprocessingBranches: true
    tieTolerance: 1.0e-12
    indexOrArrayOrderTieBreakForbidden: true
    favorableOutcomeTieBreakForbidden: true
  separation:
    deltaDefinition: Phi_best_minus_Phi_runner_up_for_max_and_Phi_runner_up_minus_Phi_best_for_min
    permitOnlyIf: Delta_action_strictly_greater_than_epsilon_numeric_plus_null
    epsilonNumericBase: 1.0e-10
    epsilonNumericObserved: maximum_of_base_and_exact_candidate_replay_absolute_error
    nullEnvelope:
      envelopeId: E01-S12-ACTION-NULL-FULLSET-BOOTSTRAP-v1.0.0
      stateMatched: true
      families: 4096
      seedPurpose: intervention
      construction: >-
        Within each preprocessing branch and direction, center scores separately
        within the observed addition and deletion action classes. Generate each
        null candidate family by sampling centered residuals with replacement
        within its action class while preserving the complete observed class
        counts; retain no-op at centered zero. Compute the selected top-two gap
        for max or bottom-two gap for min across the complete candidate family.
      threshold: empirical_0.99_quantile_method_higher
      multipleCandidateControl: complete_family_extreme_gap_not_selected_action_as_prespecified_comparison
    bothPreprocessingEnvelopesMustPass: true
  suppression:
    exactStatus: INELIGIBLE_ACTION_NOT_SEPARABLE
    appliedActionOnSuppression: noop
    affectedClaimClassification: UNDERDETERMINED
  pairing:
    policy: explicit_common_random_numbers
    commonPurposes:
      - catalytic_matrix
      - initial_state
      - event
      - waiting_time
      - fission
      - daughter_selection
    conditionSpecificPurposes: [intervention, estimator, machine_learning]
    recordFirstActionDivergence: true
    recordFirstStateDivergence: true
    recordFirstRawDrawIndexNoLongerSemanticallyAligned: true
    noCrossStateClaimAfterDivergence: true

randomness:
