      logBase: natural
      inverseValidation: ilr_inverse_then_forward_transform
      evidenceClass: VERSIONED_S12_EXTENSION_OF_S09_TRANSFORM_NOT_AUTHOR_DEFAULT
  requiredForEveryObservation:
    - retain_integer_input_state_and_exact_zero_count
    - retain_eligibility_status_and_reason
    - finite_output
    - inverse_maximum_absolute_error_at_most_1e-10
    - no_row_deletion

partitionBranch:
  branchId: E01-S12-PARTITION-PASTONLY-FIRST-PASS-LOCK-v1.0.0
  mappingId: E01-S10-PARTMAP-GROUP-MEAN-v1.0.0
  objectiveId: E01-S10-MIB-OBJ-BIDIRECTIONAL-LAGGED-GAUSSIAN-MI-v1.0.0
  normalizationId: E01-S10-MIB-NORM-NONE-v1.0.0
  searchId: E01-S10-MIB-SEARCH-SPECTRAL-FIXED-CANDIDATE-v1.0.0
  authorStatus: VALIDATION_ONLY_NOT_AUTHOR_OR_PAPER_PRIMARY
  updatePoints: post_fission_decision_points_with_n_eff_at_least_512
  lockRule: >-
    For each trajectory and preprocessing branch independently, evaluate the
    fixed S10 spectral candidate at each eligible post-fission point in temporal
    order until all partition and replay gates pass. Lock that first passing
    partition for every later prospective estimate. Never revise it using later
    data. If no partition has passed, emit PARTITION_NOT_YET_LOCKED.
  candidateConstruction: >-
    Absolute Pearson-correlation adjacency of all 99 coordinate series in the
    available prefix, zero diagonal, normalized-Laplacian Fiedler vector,
    largest-absolute-entry-positive orientation with earliest-index ties, sign
    split, zeros to part A.
  objectiveEvaluation: >-
    Arithmetic mean of the coordinate series in each part; minimize
    I(A_t;B_t+1)+I(B_t;A_t+1) with no normalization for metadata only. The
    spectral search returns one fixed candidate rather than claiming a global MIB.
  gates:
    allPartitionInputsFinite: true
    fiedlerRelativeEigengapStrictlyGreaterThan: 1.0e-10
    nonemptyParts: true
    minimumSideFractionAtLeast: 0.1
    finiteObjective: true
    deterministicReplayExact: true
    featureRelabelReplay:
      permutationCount: 3
      permutationsFromStreamPurpose: estimator
      ariMustEqual: 1.0
      objectiveAbsoluteTolerance: 1.0e-10
      canonicalInverseMapRequired: true
    failurePolicy: retain_status_reason_and_try_again_only_at_next_post_fission_point
  partitionHistoryRequired: true

estimatorBranches:
  estimatorId: E01-S10-PHYID-GAUSSIAN-STRICT-v1.0.0
  aggregateId: E01-S10-AGG-PAPER-EQUATION-v1.0.0
  aggregateFormula: str+stx+sty+sts-rtr-rtx-rty-rts
  directFormula: I_xytab-I_xtab-I_ytab
  units: nats
  covariance: numpy_cov_ddof_1
  scalarSeriesScaling: divide_each_series_by_sample_sd_ddof_1_without_mean_subtraction
  regularization: none
  biasCorrection: none
  branches:
    - redundancyId: E01-S10-REDUNDANCY-MMI-v1.0.0
      implementation: pinned_phyid
      status: VALIDATION_CANDIDATE_NOT_AUTHOR_DEFAULT
    - redundancyId: E01-S10-REDUNDANCY-CCS-v1.0.0
      implementation: pinned_phyid
      status: EXPERIMENTAL_VALIDATION_CANDIDATE_NOT_AUTHOR_DEFAULT
      caveat: pinned_source_docstrings_mark_this_path_to_be_implemented
  redundancyInvariantAggregatePolicy: >-
    The direct paper-equation scalar is algebraically independent of the
    redundancy function. Identical scalar values remain separately status-bearing
    under MMI and experimental CCS identities; branch provenance is never merged
    and full 16-atom source decompositions are retained at frozen checkpoints.
  omegaPolicy:
    discrete: EXCLUDED
    moreThan2x2Doublet: EXCLUDED
    guardedGaussian2x2: NUMERICAL_CROSS_CHECK_ONLY_NEVER_SOLE_SCIENTIFIC_IMPLEMENTATION

strictEstimateGates:
  gateId: E01-S10-SAMPLE-GATE-STRICT-v1.0.0
  allMustPassPerEstimate:
    - n_eff_at_least_512
    - preprocessing_eligible_with_no_deleted_row
    - partition_locked_from_past_only_data
    - every_input_and_derived_value_finite
    - every_scalar_series_sample_sd_ddof_1_strictly_positive
    - complete_four_vector_sample_covariance_positive_definite
    - numerical_rank_equals_four
    - condition_number_at_most_1e12
    - at_least_20_effective_samples_per_joint_dimension
    - lattice_closure_absolute_error_at_most_1e-10
    - direct_aggregate_matches_atom_aggregate_within_1e-10
    - deterministic_same_engine_replay_passed
    - estimator_and_partition_specifications_exactly_match_preregistration
  rankTolerance: max(n_eff,4)*binary64_epsilon*largest_singular_value
  maximumConditionNumber: 1.0e12
  latticeClosureAbsoluteTolerance: 1.0e-10
  numericCrosscheckAbsoluteTolerance: 1.0e-10
  numericCrosscheckRelativeTolerance: 1.0e-10
  failurePolicy: RETAIN_ROW_WITH_NULL_NUMERIC_ESTIMATE_AND_MACHINE_READABLE_REASON
  noFallbackRegularization: true
  noImputation: true

estimateEmission:
  molecularRows: every_initial_molecular_event_and_post_fission_observation_for_each_preprocessing_and_redundancy_branch
  postFissionRows: every_post_fission_decision_point_for_each_preprocessing_and_redundancy_branch
  validStatus: ELIGIBLE_NUMERIC_STRICT_EXPANDING
  requiredIdentityFields:
