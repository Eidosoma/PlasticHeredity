    - RETROSPECTIVE_SOURCE_FAMILY_RESEMBLANCE
    - REGULARIZATION_DEPENDENT_RESEMBLANCE
    - SOURCE_FAMILY_PROSPECTIVE_CANDIDATE
  operationalFailureStatus: SOURCE_RECONSTRUCTION_FAILED
