  orchestrationCores: 1
  blasThreads: 1
  openmpThreads: 1
  hardCpuHours: 50.0
  hardGpuHours: 2.0
  hardWallHours: 24.0
  hardNewArtifactBytes: 10737418240
  gpuRequired: false
  benchmark:
    firstTrajectoryMatrixIndex: 0
    modes: [IIGR_FULL, PHIRL_FULL, IIGR_PREFIX_ENDPOINT, PHIRL_PREFIX_ENDPOINT]
    projectionRule: observed_complete_first_trajectory_cpu_and_wall_times_times_12_plus_25_percent_statistics_and_validation_reserve
    stopIfProjectedCpuHoursGreaterThan: 50.0
    stopIfProjectedWallHoursGreaterThan: 24.0
    scopeReductionForbidden: true
  threadEnvironment:
    OMP_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
    NUMEXPR_NUM_THREADS: '1'
    VECLIB_MAXIMUM_THREADS: '1'

stopConditions:
  - PINNED_SOURCE_IDENTITY_CHANGED
  - PRIOR_S10_THROUGH_S12_ARTIFACT_CHANGED
  - SOURCE_EQUIVALENCE_FAILED
  - FUTURE_SUFFIX_INVARIANCE_FAILED
  - FULL_NONFINITE_FRACTION_GREATER_THAN_0.20
  - PREFIX_INELIGIBLE_FRACTION_GREATER_THAN_0.50
  - PROJECTED_RUNTIME_OR_STORAGE_EXCEEDS_CEILING
  - UNDOCUMENTED_POST_OUTCOME_CODE_CHANGE_REQUIRED
  - EXACT_SOURCE_WRAPPER_REPLAY_FAILED
stopPolicy: PRESERVE_FAILURE_COMPLETE_REQUIRED_STATUS_ARTIFACTS_AND_RETURN_FOR_HUMAN_REVIEW_WITHOUT_REPAIR
stopConditionEvaluation:
  fullNonfinite: evaluate_separately_per_implementation_over_every_expected_full_local_index_and_stop_if_either_fraction_strictly_greater_than_0.20
  prefixIneligible: evaluate_separately_per_implementation_over_post_fission_endpoints_meeting_the_256_transition_boundary_and_stop_if_either_fraction_strictly_greater_than_0.50

requiredArtifacts:
