commonGardSubstrate:
  specificationId: E01-S12B-PREPROC-ADD0p5-DROPCLR-D100-C100-v1.0.0
  source: frozen_S12_baseline_observations_only
  inputState: integer_post_event_or_selected_daughter_counts
  pseudocountDelta: 0.5
  closureFormula: x_i=(n_i+delta)/(sum_j_n_j+N_g*delta)
  clrFormula: z_i=log(x_i)-mean_j_log(x_j)
  originalMolecularComponentRemovedOneBased: 100
  outputDimension: 99
  alternatePseudocountsForbidden: true
  ilrForbidden: true
  rawCountBranchForbidden: true
  hiddenDeletionForbidden: true
  observationSampling:
    order: increasing_observationIndex_within_trajectory
    includedKinds: [initial_selected_state, molecular_event, post_fission]
    molecularEventState: post_event_integer_state
    fissionBoundary: retain_triggering_post_molecular_event_state_then_selected_post_fission_daughter_as_distinct_consecutive_observation
    noPoolingAcrossTrajectories: true
  historicalLabel:
    configurationId: E01-S08-YH-T1-HGT090-v1.0.0
    familyId: Y_H
    labelBranch: historical
    joinKey: [trajectoryId, generation]
    associationEvaluationPoints: post_fission_only
    retrospectiveCaveatRequired: true

implementations:
  IIGR_CORRECTED_SOURCE:
    fullModeId: IIGR_FULL
    prefixModeId: IIGR_PREFIX_ENDPOINT
    input: frozen_99_dimensional_clr
    preprocessing:
      - scipy_zscore_each_dimension
      - source_global_signal_regression_then_source_corrected_zscore
      - source_lag_one_linear_residualization_then_source_corrected_zscore
    constantRowNoiseScale: 1.0e-6
    constantRowNoiseRng: numpy_legacy_RandomState_domain_separated_preprocessing_seed
    mi: {function: source_bidirectional_lagged_gaussian_mi, alpha: 1, bonferonni: false, lag: 1}
    localCovarianceRegularization: none
    localObservationOffsetFromRaw: 2
  PHIRL_REGULARIZED_SOURCE:
    fullModeId: PHIRL_FULL
    prefixModeId: PHIRL_PREFIX_ENDPOINT
    input: frozen_99_dimensional_clr
    activeDimensionRule: retain_std_strictly_greater_than_1e-8
    preprocessing: [source_active_dimension_filter, scipy_zscore_each_retained_dimension]
    mi: {function: source_mutual_information_matrix_fast, alpha: 1, bonferonni: false, lag: 1}
    localCovarianceRegularization:
      formula: Sigma_epsilon=Sigma+epsilon*(trace(Sigma)/d)*I
      epsilon: 1.0e-6
    localObservationOffsetFromRaw: 1
  commonPartition:
    graphNoiseFloor: 1.0e-6
    fiedlerNormalized: false
    fiedlerMethod: networkx_source_default_tracemin_pcg
    rng: explicit_domain_separated_legacy_RandomState_for_replay
    side1: strictly_positive_entries
    side2: strictly_negative_entries
    exactZeroStatus: INELIGIBLE_FIEDLER_PARTITION_AMBIGUOUS
    emptySideStatus: INELIGIBLE_FIEDLER_PARTITION_EMPTY
    partitionMapping: arithmetic_mean_within_each_side
  localOutputs:
    primary: corrected_local_phi_r_all_declared_atoms
    diagnosticOnly: synergy_plus_downward_causation_source_name_emergence
    diagnosticCannotSelectClassification: true

temporalModes:
  full:
    exactLabel: RETROSPECTIVE_FULL_TRAJECTORY_LOCAL
    fitInput: entire_completed_trajectory_once
    fittedObjects: [source_preprocessing, lagged_mi_graph, fiedler_bipartition, partition_averages, gaussian_means, gaussian_covariances]
    allowedUses: [descriptive_spike_analysis, descriptive_replication_association, comparison_with_paper_figures_2_to_4, source_family_resemblance]
    forbiddenUses: [prospective_early_warning, first_quarter_prediction, intervention_selection, causal_control]
  prefix:
    exactLabel: PAST_ONLY_PREFIX_ENDPOINT
    endpointKinds: [post_fission]
    minimumPrecedingMolecularTransitions: 256
    prefixRows: observation_indices_0_through_endpoint_inclusive
    return: final_local_value_only
    fixedRollingWindowForbidden: true
    futureFittedPartitionForbidden: true
    futureFittedGaussianForbidden: true
    trajectoryPoolingForbidden: true
    statuses:
      - ELIGIBLE
      - INELIGIBLE_BEFORE_256_TRANSITIONS
      - INELIGIBLE_TOO_FEW_ACTIVE_DIMENSIONS
      - INELIGIBLE_FIEDLER_PARTITION_EMPTY
      - INELIGIBLE_FIEDLER_PARTITION_AMBIGUOUS
      - INELIGIBLE_COVARIANCE_EVALUATION
      - INELIGIBLE_NONFINITE_LOCAL_VALUE
      - INELIGIBLE_EXACT_REPLAY_FAILED
      - INELIGIBLE_FUTURE_SUFFIX_INVARIANCE_FAILED

sourceEquivalence:
  mustPassBeforeGardProcessing: true
  fixtureIds: [COUPLED_GAUSSIAN_A, COUPLED_GAUSSIAN_B, CONSTANT_INPUT, SINGULAR_DUPLICATE_INPUT]
  fixtureShape: {time: 320, dimensions: 8}
  comparisonFixtures: [COUPLED_GAUSSIAN_A, COUPLED_GAUSSIAN_B]
  statusFixtures: [CONSTANT_INPUT, SINGULAR_DUPLICATE_INPUT]
  gates:
    retainedVariablesIdentical: true
    miMaxAbsDifferenceAtMost: 1.0e-10
    partitionIdenticalUpToSideExchange: true
    partitionAverageMaxAbsDifferenceAtMost: 1.0e-10
    localPhiRMaxAbsDifferenceAtMost: 1.0e-9
    exactSameSeedReplay: true
    singularAndConstantStatusIdentical: true
  failureClassification: SOURCE_RECONSTRUCTION_FAILED
  failureAction: STOP_BEFORE_GARD_OUTCOMES_NO_REPAIR

futureSuffixInvariance:
  allPrefixEndpointsStructuralGate: wrapper_slices_0_through_t_before_any_source_fit_and_records_prefix_input_sha256
  executedSentinelsPerTrajectory: [first_eligible, median_eligible, last_eligible]
  variants: [suffix_removed, suffix_deterministically_shuffled, suffix_replaced_by_domain_separated_gaussian_values]
  numericRequirement: bit_exact_float64_endpoint_value_and_identical_partition_status
  failureAction: STOP_NO_REPAIR

analysis:
  primaryProspectiveEstimand: current_generation_rho_0
  secondaryProspectiveEstimand: next_generation_rho_plus_1
  representativeFigureMatrixIndices: [0, 5, 11]
  correlation: scipy_spearman_two_sided_reported_with_preregistered_one_sided_positive_null_for_classification
  undefinedCorrelationPolicy: preserve_status_and_exclude_from_numeric_summary_never_impute
  bootstrap:
    replicates: 4096
    unit: trajectory
    statistic: median_of_defined_trajectory_spearman_correlations
    interval: percentile_2.5_97.5_numpy_linear
  circularShiftNull:
    replicates: 4096
    unit: within_trajectory_labels
    offsets: independent_uniform_integer_1_through_n_minus_1_for_each_defined_trajectory
    statistic: median_of_defined_trajectory_spearman_correlations
    positiveP: (1+count(null_statistic>=observed))/(4096+1)
    negativeP: (1+count(null_statistic<=observed))/(4096+1)
  fullAssociationPoints: post_fission_local_value_joined_to_historical_generation_label
  retrospectiveCoherenceRule:
    ruleId: E01-S12B-FULL-PAPER-DIRECTED-COHERENCE-v1.0.0
    allMustPass:
      finiteCoverageAtLeast: 0.80
      definedTrajectoryCorrelationsExactly: 12
      positiveTrajectoryCorrelationsAtLeast: 9
      medianTrajectoryCorrelationStrictlyGreaterThan: 0.0
      trajectoryBootstrapLower95StrictlyGreaterThan: 0.0
      positiveCircularShiftPAtMost: 0.05
      runsWithHigherReplicationMeanAtLeast: 7
    rationale: ceil_paper_73_of_100_positive_equals_9_of_12_and_ceil_57_of_100_higher_equals_7_of_12
  prospectiveCandidateRule:
    coverageAfterBoundaryAtLeast: 0.80
    definedTrajectoryCorrelationsExactly: 12
    positiveTrajectoryCorrelationsAtLeast: 9
    medianTrajectoryCorrelationStrictlyGreaterThan: 0.0
    trajectoryBootstrapLower95StrictlyGreaterThan: 0.0
    positiveCircularShiftPAtMost: 0.05
    exactFutureSuffixInvariance: true
    exactSourceReplay: true
    otherImplementationOppositeDirectionForbidden: true
    oppositeDirectionDefinition: median_less_than_zero_AND_bootstrap_upper_less_than_zero_AND_negative_circular_shift_p_at_most_0.05
  aggregateTrend:
    alignment: interpolate_each_full_local_series_to_1001_equal_molecular_progress_points_then_mean_across_runs
    test: ordinary_least_squares_slope_two_sided
  spikes:
    scope: pool_all_finite_full_local_values_within_one_implementation
    positiveThreeSigma: value_strictly_greater_than_pooled_mean_plus_3_times_sample_sd
    negativeThreeSigma: value_strictly_less_than_pooled_mean_minus_3_times_sample_sd
    robustPositive: value_strictly_greater_than_pooled_median_plus_3_times_1.4826_times_MAD
    spikeOverlap: positive_three_sigma_sets_at_shared_eligible_post_fission_points_using_separate_full_and_prefix_thresholds
    emptyUnionJaccard: 1.0
  ljungBox:
    perTrajectoryLag: min_20_and_floor_number_of_finite_local_values_divided_by_5
    alpha: 0.05
  futureDependence:
    sharedPoints: eligible_post_fission_points_with_finite_full_and_prefix_values
    delta: full_minus_prefix
    normalizedDifference: median_absolute_delta_divided_by_full_IQR
    rankPercentile: (average_rank_minus_0.5)/number_of_shared_points_within_trajectory
    materialRankChangeThresholdStrictlyGreaterThan: 0.10
    partitionAgreement: adjusted_rand_index_over_original_99_features
    signAgreementReference: zero
    replicationAssociationDifference: full_rho_minus_prefix_rho
    partitionAriEncoding: original_99_features_with_full_or_prefix_dropped_features_encoded_as_separate_minus_1_cluster
  firstQuarterAudit:
    cutoffRawObservationIndex: floor_0.25_times_final_zero_based_observation_index
    truncatedFitInput: observations_0_through_cutoff_inclusive
    comparison: completed_fit_local_values_ending_at_or_before_cutoff_versus_truncated_fit_values_at_same_raw_observation_indices

