metricIdentity:
  scalarId: SOURCE_DEFINED_CAUSAL_EMERGENCE_SYNERGY_PLUS_DOWNWARD_CAUSATION-v1.0.0
  synergyAtom: '[[[0,1]],[[0,1]]]'
  downwardCausationAtoms:
    - '[[[0,1]],[[0]]]'
    - '[[[0,1]],[[1]]]'
  exactFormula: emergence = synergy + downward_causation
  downwardFormula: downward_causation = pi_01_to_0 + pi_01_to_1
  noAdditionalAtoms: true
  noClipping: true
  noNonfiniteReplacement: true
  retainedArrays: [synergy, downward_causation, emergence, local_phi_r]
  hierarchy:
    primaryConfirmatory: IIGR_EMERGENCE_FULL
    primaryProspective: IIGR_EMERGENCE_PREFIX_ENDPOINT
    regularizationRobustness: PHIRL_EMERGENCE_FULL
    regularizedProspective: PHIRL_EMERGENCE_PREFIX_ENDPOINT
    frozenComparator: S12C_CORRECTED_LOCAL_PHI_R
  phirlMayNotReplaceIigrAsPrimary: true

metricEquivalenceGate:
  requiredBeforeScientificAnalysis: true
  s12cFixtureSuites:
    - S12C_DEVELOPMENT
    - S12C_CONFIRMATION
  s12cFixtureIds:
    - COUPLED_GAUSSIAN
    - COUPLED_AUTOREGRESSIVE
    - CONSTANT_INPUT
    - SINGULAR_DUPLICATE_INPUT
    - NEAR_SINGULAR_DUPLICATE_INPUT
    - LOW_RANK_LINEAR_COMBINATION_INPUT
    - REPLAY_PARTIAL_CONSTANT_INPUT
  newUntouchedFixtures:
    ordinary: [S12D_ORDINARY_BLOCK_GAUSSIAN_A, S12D_ORDINARY_COUPLED_VAR_B]
    singular: [S12D_SINGULAR_DUPLICATE_A, S12D_SINGULAR_LOWRANK_B]
    nearSingular: [S12D_NEAR_SINGULAR_A, S12D_NEAR_SINGULAR_B]
  implementationsPerFixture: [IIGR_CORRECTED_SOURCE, PHIRL_REGULARIZED_SOURCE]
  expectedRows: 40
  availabilityStatusIdentical: true
  atomArrayLengthIdentical: true
  maximumAbsoluteDifferenceAtMost: 1.0e-12
  exactSameSeedReplay: true
  identicalNonfiniteMasks: true
  canonicalTupleSerializationIdentical: true
  allRowsMustPass: true
  failureClassification: SOURCE_EMERGENCE_IDENTITY_RECONSTRUCTION_FAILED
  repairAfterFailureForbidden: true
  scientificAnalysisAfterFailureForbidden: true

dataFirewall:
  existing:
    count: 12
    roleLabel: EXPLORATORY_EXISTING_TRAJECTORIES
    uses: [pipeline_validation, integrated_versus_emergence_comparison, runtime_measurement, figure_generation_testing, estimand_sanity_checks]
    forbiddenUses: [formula_selection, atom_selection, implementation_selection, gate_selection, confirmation_count_selection, label_selection, preprocessing_selection]
  confirmation:
    count: 24
    roleLabel: UNTOUCHED_CONFIRMATION_TRAJECTORIES
    generateAllBeforeAnyEmergenceOutcome: true
    freezeBeforeEmergence:
      - catalytic_matrices
      - initial_states
      - event_streams
      - fission_streams
      - complete_trajectory_payloads
      - replicator_labels
      - preprocessing_outputs
    independentUnit: catalytic_matrix
  zeroOutcomeAccessBeforeMethodLock: true
  existingDiagnosticForbiddenBeforeMethodLock: /artifacts/research_steps/S12C/source_diagnostic_outputs.parquet

