  prefix:
    ids: [IIGR_EMERGENCE_PREFIX_ENDPOINT, PHIRL_EMERGENCE_PREFIX_ENDPOINT]
    label: PAST_ONLY_PREFIX_ENDPOINT
    endpoint: every_post_fission_point_at_or_after_256_prior_molecular_transitions
    fit: exact_prefix_from_observation_zero_through_endpoint_inclusive
    retainedValue: final_local_value_only
    rollingWindowForbidden: true
    futureFitForbidden: true
    poolingForbidden: true
    invariance:
      structuralAtEveryEndpoint: true
      executedSentinelsPerTrajectory: [first, middle, last]
      variants: [suffix_deletion, suffix_deterministic_shuffle, suffix_domain_separated_replacement]
      exactResultRequired: true
    explicitIneligibilityRequired: true

statistics:
  bootstrapReplicates: 4096
  circularShiftReplicates: 4096
  primaryLabel: HISTORICAL_H090_REPLICATOR
  secondaryLabel: PAST_ONLY_COSINE_REPLICATOR
  primaryRetrospectiveEstimand: within_trajectory_spearman_emergence_current_historical_label_at_post_fission
  primaryProspectiveEstimand: current_generation_rho_0
  secondaryProspectiveEstimand: current_generation_rho_0_past_only_cosine_label
  additionalProspectiveDiagnostic: next_generation_rho_plus_1_historical_label
  trajectoryBootstrapStatistic: median_defined_trajectory_statistic
  circularShiftNullStatistic: median_defined_within_trajectory_spearman
  circularShiftOffsets: independently_uniform_integer_1_through_n_minus_1_per_trajectory_per_replicate
  ordinaryPerTrajectoryPValues: scipy_spearman_two_sided_unadjusted_paper_like_diagnostic_only
  blockAwareDriftPermutation: within_trajectory_circular_shift_label_null_of_median_mean_difference
  effectiveEpisodeDefinition: number_of_contiguous_true_runs_in_primary_label
  temporalAutocorrelation: lag_one_pearson_on_finite_series
  aggregateTrend: interpolate_each_trajectory_to_1001_point_relative_molecular_time_then_OLS_mean_curve
  excursionThresholds: [mean_plus_or_minus_3_sample_sd, median_plus_or_minus_3_times_1.4826_MAD]
  excursionThresholdScope: separately_within_each_trajectory_and_metric_mode
  peakAlgorithm: scipy_signal_find_peaks_with_zero_minimum_prominence_then_peak_widths_at_half_prominence
  spikeProximity:
    fission: minimum_absolute_molecular_step_distance
    partitionChange: minimum_absolute_generation_distance
    nonfiniteOrIllConditionedState: minimum_absolute_observation_index_distance
  rankChangeThresholdPercentilePoints: 10

decisionGates:
  confirmationFullIigrAssociation:
    finiteCoverageAtLeast: 0.80
    definedTrajectoriesAtLeast: 20
    positiveTrajectoriesAtLeast: 18
    medianStrictlyPositive: true
    trajectoryBootstrapLower95StrictlyPositive: true
    circularShiftPositivePAtMost: 0.05
  confirmationFullIigrDriftDifference:
    definedTrajectoriesAtLeast: 20
    positiveMeanDifferencesAtLeast: 14
    medianMeanDifferenceStrictlyPositive: true
    trajectoryBootstrapLower95StrictlyPositive: true
    blockAwarePositivePAtMost: 0.05
  confirmationFullIigrCoherent: association_and_drift_difference_gates_all_pass
  confirmationPunctuatedResemblance:
    runsWithAtLeastOnePositive3SigmaSpikeAtLeast: 18
    aggregateTrendPStrictlyGreaterThan: 0.05
    rawLjungBoxSignificantRunsAtLeast: 21
    differencedLjungBoxSignificantRunsAtMost: 0
    interpretation: separate_descriptive_resemblance_gate_not_required_for_positive_association_classification
  confirmationProspectiveIigr:
    eligibleCoverageAtLeast: 0.80
    definedTrajectoriesAtLeast: 20
    positiveTrajectoriesAtLeast: 18
    medianStrictlyPositive: true
    trajectoryBootstrapLower95StrictlyPositive: true
    circularShiftPositivePAtMost: 0.05
    futureSuffixInvarianceExact: true
    sourceReplayExact: true
    noSignificantOppositePhiRL: true
  exploratoryExistingIigrGate:
    definedTrajectoriesExactly: 12
    positiveTrajectoriesAtLeast: 9
    medianStrictlyPositive: true
    trajectoryBootstrapLower95StrictlyPositive: true
    circularShiftPositivePAtMost: 0.05
    positiveMeanDifferencesAtLeast: 7
  classificationHierarchy:
    - SOURCE_EMERGENCE_IDENTITY_RECONSTRUCTION_FAILED
    - SOURCE_EMERGENCE_PROSPECTIVE_CANDIDATE
    - RETROSPECTIVE_SOURCE_EMERGENCE_RESEMBLANCE
    - REGULARIZATION_DEPENDENT_SOURCE_EMERGENCE_RESEMBLANCE
    - SOURCE_DEFINED_EMERGENCE_NOT_SUPPORTED
  metricSpecificityConclusion: >-
    S12C_negative_result_is_metric_specific only if the frozen comparator fails,
    the exploratory existing IIGR emergence gate passes, and the untouched
    confirmation IIGR emergence gate passes; otherwise classify as not
    established or underdetermined without changing S12C.

