frozenQuestion: >-
  Does the scalar literally named emergence by the two pinned public source
  implementations, synergy plus downward causation, reproduce a positive and
  punctuated relationship with frozen compositional self-replication labels;
  does any relationship survive past-only prefix fitting; was S12C's negative
  result specific to its integrated local-Phi-r scalar; and does the answer
  confirm on 24 newly generated, untouched catalytic matrices?

