frozenQuestion: >-
  Can one source-grounded, dependency-ordered reconstruction match the paper's
  molecular time base, 100-generation GARD behavior, control replicator
  fingerprints, retrospective causal-emergence association, and (only if all
  upstream gates pass) the direction of the stated max/control/min intervention?

