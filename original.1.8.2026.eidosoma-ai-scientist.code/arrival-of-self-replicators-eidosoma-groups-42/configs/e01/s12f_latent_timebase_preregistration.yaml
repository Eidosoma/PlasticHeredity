  statisticsWorkers: 1
  orchestrationCores: 1
  blasThreadsPerWorker: 1
  cpuHourCeiling: 250.0
  gpuHourCeiling: 12.0
  wallHourCeiling: 72.0
  retainedArtifactGiBCeiling: 30.0
