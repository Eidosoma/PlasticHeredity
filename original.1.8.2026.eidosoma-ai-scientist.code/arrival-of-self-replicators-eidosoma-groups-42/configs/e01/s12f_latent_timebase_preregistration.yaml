  paper:
    arxivId: 2607.28250v1
    pdfPath: /cache/e01_s03/downloads/paper-2607.28250v1.pdf
    sha256: 77a2ec2c0751839d8a2e10863ca803c6f8b61475bbc790f2bbdad2a38af04ae4
    figure2Path: /workspace/input-attachments/ed5486bf-a043-485b-a233-d88d8d123759/figures/figure-02.png
    figure2Sha256: 0e4aac507ccf6e10ced31edd6d7e5ba8c876d9d0c8d420b145dfc27c7d040778
  historicalGard:
    path: /cache/e01_s03/sources/gard-historical
    commit: 86dff6320d5ae91b4e831471079ff46749b14df9
  iigr:
    path: /cache/e01_s12b/sources/IntegratedInformationGeneRegulation
    commit: 7c1c22fe39f539d4a453135476f1f0dd5a6b45f7
  phirl:
