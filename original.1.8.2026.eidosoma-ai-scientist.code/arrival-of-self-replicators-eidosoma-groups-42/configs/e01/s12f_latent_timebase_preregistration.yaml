recommendedNextActionIfCandidate: >-
  Return for human review and recommend only a separately preregistered S12G
  applying frozen labels and validated source-defined emergence to the locked
  time-base candidate or posterior ensemble.
recommendedNextActionIfNoCandidate: >-
  Return for human review with S13 blocked; do not broaden the kernel family or
  begin labels, emergence, interventions, S12G, or S13 automatically.
