    - figures/association_distributions.png
    - figures/full_prefix_comparison.png
    - figures/metric_identity_comparison.png
    - figures/ensemble_decision_matrix.png

stopRules:
  - any_prior_or_input_hash_changes
  - candidate_identity_or_count_changes
  - source_equivalence_or_metric_identity_evidence_fails
  - any_locked_trajectory_not_complete_or_replay_valid
  - any_full_or_prefix_source_fit_fails_exact_replay
  - any_prefix_future_suffix_test_fails
  - any_candidate_source_branch_falls_below_operational_coverage_gate
  - undocumented_post_outcome_method_change_required
  - runtime_or_storage_projects_beyond_hard_ceiling
  - incomplete_status_bearing_outputs_or_manifest_failure
  - any_new_GARD_trajectory_is_created

forbiddenWork:
  - S13
  - intervention
  - prediction
  - MLP
  - candidate_discovery
  - estimator_repair
  - candidate_elimination
  - candidate_reweighting
  - broader_scale_up
  - alternate_label
  - alternate_preprocessing
  - alternate_metric
  - author_primary_or_paper_primary_claim

handoff:
  alwaysReturnForHumanReview: true
  s13RemainsBlockedRegardlessOfOutcome: true
