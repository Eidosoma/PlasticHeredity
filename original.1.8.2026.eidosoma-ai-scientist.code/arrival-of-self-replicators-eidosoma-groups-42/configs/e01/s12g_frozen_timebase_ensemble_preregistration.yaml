    - candidate_associations.csv
    - replicator_drift_results.csv
    - temporal_dependence_results.csv
    - spike_results.csv
    - metric_identity_results.csv
    - future_dependence_results.csv
    - cross_candidate_results.csv
    - ensemble_adjudication.csv
