frozenQuestion: >-
  Does the S12FR candidate-1 dynamics remain a paper-compatible time-base
  candidate when its analysis clock is changed uniformly from C0 to the
  selected-daughter-inclusive C1 clock at every fission, and, only if so, do
  the unchanged S12G label and source-emergence conclusions agree across the
  resulting three-candidate ensemble?

