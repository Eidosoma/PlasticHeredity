  do the two S12FR-confirmed C1 candidates and the non-confirmed near-envelope
  candidate-1 C1 derivative give the same frozen label/source-emergence
  conclusion when all 96 tasks are freshly recomputed from locked raw
  trajectories under the unchanged S12G scientific contract?

