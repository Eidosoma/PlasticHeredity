    derivedFieldMustBeAbsentBeforeAdapter: true
    sourceAndDerivedNonnull: true
    sourceAndDerivedInteger: true
    exactRowwiseIdentity: true
    rowCountUnchanged: true
    rowOrderUnchanged: true
    originalColumnOrderUnchanged: true
    everyOriginalFieldExactEquality: true
    everyOriginalFieldCanonicalArrowHashUnchanged: true
    sourceParquetHashUnchanged: true
    uniquenessKeys:
