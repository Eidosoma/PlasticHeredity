      - trajectoryId
      - implementationId
      - generation
    monotonicGroupKeys:
      - candidateId
      - trajectoryId
      - implementationId
    monotonicField: endpointRawObservationIndex
    monotonicity: strictly_increasing
    endpointIdentityJoin:
      labelId: HISTORICAL_H090_REPLICATOR
      prefixKeys: [candidateId, trajectoryId, matrixIndex, generation]
      labelKeys: [candidateId, trajectoryId, matrixIndex, generation]
      expectedLabelField: postFissionRawObservationIndex
      requireEveryPrefixRowMatched: true
      requireExactIndexIdentity: true

