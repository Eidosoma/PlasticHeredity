decisionGates:
  scaleRationale: >-
    Preserve the S12G/S12J proportions when scaling from 32 to 100 units:
    80-percent defined/coverage, 75-percent positive association, the original
    14-of-24 drift proportion rounded upward, 75-percent spiking, and 87.5-percent
    raw temporal dependence. Continuous, resampling, direction, and p-value gates
    are unchanged.
  candidateRetrospectiveIigrAssociation:
    finiteCoverageAtLeast: 0.80
    definedTrajectoriesAtLeast: 80
    positiveTrajectoriesAtLeast: 75
    medianStrictlyPositive: true
    trajectoryBootstrapLower95StrictlyPositive: true
    circularShiftPositivePAtMost: 0.05
  candidateRetrospectiveIigrDrift:
    definedTrajectoriesAtLeast: 80
    positiveMeanDifferencesAtLeast: 59
    medianMeanDifferenceStrictlyPositive: true
    trajectoryBootstrapLower95StrictlyPositive: true
    blockAwarePositivePAtMost: 0.05
  candidateRetrospectiveCoherent: association_and_drift_gates_all_pass
  candidateProspectiveIigr:
    eligibleCoverageAtLeast: 0.80
    definedTrajectoriesAtLeast: 80
    positiveTrajectoriesAtLeast: 75
    medianStrictlyPositive: true
    trajectoryBootstrapLower95StrictlyPositive: true
    circularShiftPositivePAtMost: 0.05
    exactReplay: true
    exactSuffixInvariance: true
    noSignificantOppositePhiRL: true
  punctuatedSeparateGate:
    runsWithPositive3SigmaSpikeAtLeast: 75
    aggregateTrendPStrictlyGreaterThan: 0.05
    rawLjungBoxSignificantRunsAtLeast: 88
    differencedLjungBoxSignificantRunsAtMost: 0
    role: descriptive_only_not_part_of_combined_positive_gate
  combinedCandidatePositive: retrospective_coherent_and_prospective_iigr
  heldoutScaleupPositive: both_confirmed_candidates_combined_positive
  candidateSensitive: exactly_one_confirmed_candidate_combined_positive
  heldoutNonSupport: neither_confirmed_candidate_combined_positive

