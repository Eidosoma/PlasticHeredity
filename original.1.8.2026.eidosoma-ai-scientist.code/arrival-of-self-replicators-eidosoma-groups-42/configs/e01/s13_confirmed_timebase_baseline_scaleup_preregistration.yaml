  S12FR time-base candidates, does the S12J near-zero/non-support result persist,
  or do both candidates pass the same frozen retrospective and prospective
  source-emergence gates?

interpretationBoundary:
  - This is one baseline-only held-out scale-up and not the original S13-S18 sequence.
  - It cannot identify the unavailable author implementation.
  - It cannot resolve fixed-window, pre-256-transition, or early-warning ambiguity.
  - Full-trajectory fits remain retrospective and potentially future-dependent.
  - A positive result conflicts with prior negative evidence and requires human adjudication.
  - No outcome authorizes prediction, intervention, S14-S18, E02, or another scale-up.
  - Repeated repairs and human overrides remain a procedural-credibility caveat.

