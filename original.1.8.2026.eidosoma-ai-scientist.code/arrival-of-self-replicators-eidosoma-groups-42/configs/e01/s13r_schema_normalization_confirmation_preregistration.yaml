  sourceTable: labels.parquet
  derivedViewOnly: true
  sourceMutationPermitted: false
  exactPermittedFields:
    clusterId:
      fromType: 'null'
      toType: string
    referenceObservationId:
      fromType: 'null'
      toType: string
    metricToReference:
      fromType: 'null'
      toType: double
  expectedCanonicalTaskCount: 195
  expectedAdaptedTaskCount: 5
  exactAffectedTasks:
    - S12F-CANDIDATE-02/M30
    - S12F-CANDIDATE-02/M35
    - S12F-CANDIDATE-02/M63
    - S12F-CANDIDATE-03/M35
    - S12F-CANDIDATE-03/M63
  forbiddenOperations:
    - cast_any_other_field
    - alter_any_nonnull_value
    - alter_any_null_mask
    - alter_row_count_or_order
    - alter_column_names_or_order
    - alter_task_identity
    - mutate_source_file
    - use_partial_s13_concatenation
    - omit_any_task

adapterGates:
  all200ViewsShareCanonicalSchema: true
  rowCountsUnchanged: true
  rowOrderUnchanged: true
  columnNamesAndOrderUnchanged: true
  everyValueUnchanged: true
  everyNullMaskUnchanged: true
  taskIdentitiesUnchanged: true
  everyNonAdapterFieldTypeAndBytesUnchanged: true
  canonical195ValueIdentical: true
  exactlyFiveViewsAdapted: true
  sourceHashesUnchanged: true

downstreamContract:
  runOnlyAfterAdapterPasses: true
  useExactS13StatisticsImplementation: true
  useOriginalS13Seeds: true
  useOriginalS13Gates: true
  useOriginalS13CandidateIdentities: true
  useOriginalS13LabelsAndPreprocessing: true
  useOriginalS13MetricAndTemporalModes: true
  useOriginalS13ReplayAndSuffixRequirements: true
  analyses:
