humanOptionId: option-1
evidenceClass: POST_FAILURE_SCHEMA_REPAIRED_HELD_OUT_ANALYSIS
humanOverride: >-
  Explicitly override S13's no-repair rule once and only once, solely to create
  typed statistical views for the five all-null S13 label tables. S13 and its
  S13_VALIDATION_FAILED_CLOSED classification remain immutable.

frozenQuestion: >-
  Are the five physically all-null S13 label tables logically identical to the
  canonical typed label schema, and, only if that narrow adapter gate passes,
  what result do the already frozen S13 statistics and two-candidate gate return?

immutability:
  preserveSteps: S01-S13
  priorArtifactsByteExact: true
  s13ClassificationRetained: S13_VALIDATION_FAILED_CLOSED
  s13ScientificAssociationRetained: NOT_EVALUATED
  sourceCacheByteExact: true
  partialS13ConcatenationUsePermitted: false
  subsetAnalysisPermitted: false

