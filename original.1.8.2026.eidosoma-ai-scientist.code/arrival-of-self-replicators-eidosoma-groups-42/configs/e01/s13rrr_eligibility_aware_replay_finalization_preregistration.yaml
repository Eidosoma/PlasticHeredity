dateFrozen: '2026-08-06'
humanOptionId: option-2
evidenceClass: THIRD_OVERRIDE_POST_OUTCOME_ELIGIBILITY_EXCEPTION_ANALYSIS
humanOverride: >-
  Explicitly override the S13RR permanent-stop rule a third time, solely to
  replace the fixed 3,600 executed-sentinel gate with the exact frozen-data
  availability requirement of 3,552 and to normalize two reporting column
  orders without changing any scientific value.

frozenQuestion: >-
  Do all 3,552 suffix sentinel comparisons that are executable under the 200
  frozen trajectories pass, are the other 48 nominal slots exactly unavailable,
  and—after only two value-preserving reporting reorders—what result do two
  exact executions of the unchanged S13 statistics and adjudication return?

