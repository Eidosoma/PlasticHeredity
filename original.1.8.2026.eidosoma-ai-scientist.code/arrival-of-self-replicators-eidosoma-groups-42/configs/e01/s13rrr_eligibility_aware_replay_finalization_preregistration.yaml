    S12F-CANDIDATE-03/M72:
      nominalSlots: 18
      applicableSlots: 0
      notApplicableSlots: 18
      eligibleEndpointsPerImplementation: 0
      reason: NO_ENDPOINT_AT_OR_ABOVE_256_TRANSITIONS
