      applicableSlots: 6
      notApplicableSlots: 12
      eligibleEndpointsPerImplementation: 1
      reason: FIRST_MIDDLE_LAST_COLLAPSE_TO_ONE_UNIQUE_GENERATION
    S12F-CANDIDATE-02/M72:
      nominalSlots: 18
      applicableSlots: 0
      notApplicableSlots: 18
