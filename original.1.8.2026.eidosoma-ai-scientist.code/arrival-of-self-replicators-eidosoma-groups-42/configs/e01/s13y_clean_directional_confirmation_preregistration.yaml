frozenQuestion: >-
  Does the single S13X-selected retrospective branch—PhiRL regularized
  source-defined emergence in completed-trajectory level mode, aligned to the
  same molecular state as the incoming adjacent-composition H>0.9 label—retain
  its positive association and replicator-minus-drift direction on 100 genuinely
  new matrices under both confirmed time-base candidates; and does it provide
  information beyond the H similarity that deterministically defines that label?

interpretationBoundary:
  - S13X selected the tested branch adaptively; S13Y tests that fixed post-selection hypothesis only.
  - Completed-trajectory values are labeled RETROSPECTIVE_FULL_TRAJECTORY_LOCAL and may use future observations in fitted distributions and partitions.
  - A positive result can support only retrospective directional resemblance.
  - No result supports early warning, prediction, intervention efficacy, causal control, fixed-window claims, or author-code identity.
  - S13RRR held-out non-support and all strict, prefix, intervention, sensitivity, failure, and override evidence remain unchanged and must be synthesized alongside S13Y.
  - Candidate-specific results are primary; cross-candidate confirmation requires the same gate to pass independently for candidates 2 and 3.

