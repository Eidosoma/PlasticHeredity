labelCircularityControls:
  continuousSimilarityField: incomingCosineH
  ordinaryCompositionChangeField: euclideanL2ClosedCompositionChange
  ordinaryCompositionChangeDirectionForSimilarity: negative_change
  exactIdentityRequired: primary_label_equals_indicator_H_strictly_greater_than_0.9_every_row
  baselinePredictionIdentity: H_alone_determines_primary_label_exactly
  conditionalEntropyRule: H_of_Y_given_exact_H_equals_zero_bits_when_identity_passes
  conditionalInformationRule: I_of_PhiRL_and_Y_given_exact_H_equals_zero_by_deterministic_label_identity
  implication: >-
    No empirical model may claim unrestricted incremental information about the
    binary H>0.9 label after conditioning on exact H; positive completed-fit
    association can therefore be classified at most as label-coupled unless the
    frozen identity check unexpectedly fails, which is itself a fatal validation failure.
  smoothThresholdDiagnostic:
    role: model_dependent_diagnostic_not_override_of_exact_identity
    estimand: coefficient_of_binary_label_in_emergence_regression_after_fixed_smooth_H_and_L2_change_controls
    controls:
      - trajectory_fixed_effects_via_within_trajectory_centering
      - H
      - H_squared
      - H_cubed
      - hinge_H_minus_0.95_positive_part
      - hinge_H_minus_0.99_positive_part
      - log1p_euclidean_L2_change
    trajectoryBootstrapReplicates: 4096
  durationPreservingNull:
    method: nonzero_circular_rotation_of_each_complete_binary_trajectory
    preserves: cyclic_label_sequence_and_episode_durations
    replicates: 4096
  historicalComparator:
    labelId: HISTORICAL_H090_REPLICATOR
    alignment: generation_label_propagated_to_same_molecular_state

