    timeToFirstNormalized: {mean: 0.37, dispersion: 0.27}
  MIN:
    persistence: {mean: 559, dispersion: 99}
    probability: {mean: 0.80, dispersion: 0.03}
    consistency: {mean: 0.42, dispersion: 0.04}
    timeToFirstNormalized: {mean: 0.40, dispersion: 0.28}
  dispersionMeaning: UNDERDETERMINED_SD_OR_SE

