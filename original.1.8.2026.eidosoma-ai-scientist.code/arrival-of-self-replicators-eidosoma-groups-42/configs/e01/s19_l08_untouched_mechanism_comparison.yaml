    - S17 CPU-allowance waiver
seedContract:
  rootSeedHex: cf01593507937c62777e4999670f072583db3bce60c281de5a91177a6700f643
  matrixPhase: s19_l08_untouched_mechanism_comparison
  bootstrapRootHex: 390de5af8edd2be9c26dcc2ab49a3a946d6d1b69eb2a106ce477ff874b250dde
  seedRootDerivationStatement: SHA256 of the literal domain string E01-S19-L08-UNTOUCHED-MATRIX-ROOT-v1.0.0::2026-08-09::DOMAIN-SEPARATED
  noOverlapWithPriorMatrixInitialOrSeedMaterial: true
  matrixIndices: {startInclusive: 0, stopExclusive: 100}
  replacementPolicy: NEVER_REPLACE
numericalContract:
  authority: CPU_FLOAT64
  gpuHours: 0
  numericalLibraryThreadsPerWorker: 1
  workers: 8
  strictSimilarityComparator: GREATER_THAN
  similarityThreshold: 0.9
  exactReplayRequired:
    - trajectorySha256
    - observation sequence and integer states
    - terminal status and completed fissions
