  scientificLabelsOpenedDuringBenchmark: false
  projectedTotalIncludesPrimaryAndCompleteRegeneration: true
  stopIfProjectedCpuHoursExceed: 90
stopBoundary: Freeze all outputs and return for mandatory human review; do not activate L09, S20, E02, author contact, report-bundle generation, prediction, emergence, or intervention work.
