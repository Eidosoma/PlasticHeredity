  failedL11MustRemainUnchanged: true

repairContract:
  repairCountMaximum: 1
  repairTarget: U2_MULTI_CENTROID_NUMERICAL_SANITATION_ONLY
  sourcePolicy: EXACT_L10_MATERIAL_NEGATIVE_REFERENCE_POLICY
  finiteCoordinateBelow: -1.0e-12
  belowAction: GLOBAL_STOP_MATERIAL_NEGATIVE
  clampRangeInclusive: [-1.0e-12, 0.0]
  clampValue: 0.0
  afterClamp: RECLOSE_EACH_CENTROID_TO_POSITIVE_UNIT_SUM
  zeroSumAction: GLOBAL_STOP
  scientificMethodChanged: false
  secondRepairPermitted: false

sourceAuditGate:
  requiredStatements:
    - TGS_NONDRIFT_RETURNS_LOGICAL_NONDRIFT_INDEX
    - TGS_ACLUSTER_INITIALIZES_COMPLETE_TAG_MATRIX_TO_ZERO
