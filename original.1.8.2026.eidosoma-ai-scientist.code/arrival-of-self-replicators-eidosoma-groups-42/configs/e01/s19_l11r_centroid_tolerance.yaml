    l08: NEITHER_MECHANISM_REPRODUCES_ON_UNTOUCHED_DATA
    l09: LOOP_FAILED_CLOSED
    l10: RECURRING_ATTRACTOR_LABEL_NOT_RECONSTRUCTED
