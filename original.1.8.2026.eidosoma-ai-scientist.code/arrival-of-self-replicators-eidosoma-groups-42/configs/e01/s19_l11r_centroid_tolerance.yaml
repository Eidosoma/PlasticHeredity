title: One-Repair Confirmation of the L11 U2 Centroid Numerical Tolerance
designClass: ADDITIVE_EXPLORATORY_ONE_REPAIR_NUMERICAL_TOLERANCE_CONFIRMATION

immutableBoundary:
  preserveByteForByte:
    - S01-S18
    - E01 forensic replication V1 bundle
    - E01 forensic replication V2 artifact
    - S19-L01-S19-L11 including L06R
    - every prior classification, failure, waiver, seed, source snapshot, regeneration record, and artifact hash
