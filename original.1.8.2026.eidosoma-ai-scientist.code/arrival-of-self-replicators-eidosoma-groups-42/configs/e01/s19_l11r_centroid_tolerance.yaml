    substrate: 100_SELECTED_POST_FISSION_RELATIVE_COMPOSITIONS
    clustering: EXACT_L10_R1_MATLAB_COMPATIBLE_HISTORICAL_PIPELINE
    prefilter: PINNED_TGS_NONDRIFT_TECHNIQUE_1_STRICT_H090
    metric: COSINE_DISTANCE
