controls:
  NC1_VALID_LABEL_PERMUTATION:
    scope: P1 under S11
    rule: independently permute valid labels within fit and validation cells while retaining every padding zero and boundary
  NC2_PADDING_BOUNDARY_PERMUTATION:
    scope: deterministic boundary diagnostic
    rule: permute true output-length identities across matrices while leaving input lengths, valid labels and scientific target arrays unchanged
  NC3_INPUT_LENGTH_OBFUSCATION:
    scope: P1 under S11
    rule: replace scaled values only where input time mask is false with domain-separated matched Gaussian noise; retain channel and time masks
  NC4_FEATURE_TEMPORAL_PERMUTATION:
    scope: P1 under S11
    rule: permute valid first-quarter feature rows and channel masks within matrix; retain valid length
  NC5_MATRIX_LABEL_PERMUTATION:
    scope: P1 under S11
    rule: permute complete padded target arrays among fit matrices only; validation and test targets remain unchanged
  NC6_COMPLETED_FIT_SUFFIX_PERTURBATION:
    sentinelMatrices: [0, 24, 49, 74]
    mutation: deterministic suffix permutation
    required: P2 exact invariance and quantified P1 change

