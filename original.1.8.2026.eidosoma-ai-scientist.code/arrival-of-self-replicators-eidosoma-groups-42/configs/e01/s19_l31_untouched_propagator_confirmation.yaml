  - landmark_search
  - candidate_pooling
  - observed_suffix_use_by_branches
  - transition_current_analysis
  - intervention
  - author_contact
ceilings:
  cpu_hours: 100
  gpu_hours: 0
  wall_hours: 72
  retained_gib: 25
  temporary_gib: 75
  validation_reserve_fraction: 0.10
