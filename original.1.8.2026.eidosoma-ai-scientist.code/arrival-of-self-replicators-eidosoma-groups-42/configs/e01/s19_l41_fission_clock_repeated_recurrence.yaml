schema: eidosoma.e01.s19_l41.preregistration.v1
version: E01-S19-L41-FISSION-CLOCK-REPEATED-CROSS-GENERATION-RECURRENCE-v1.0.0
status: PREOUTCOME_LOCK
question: >-
  At a clock matched to the process, does the frozen GARD state have a reliable
  probability of two online-certified cross-generation returns after genuine
  departures, and can a shorter independent fission-clock shooting calculation
  rank that probability?
inputs:
  states: 280 frozen L28/L31 restored states
  prefixes: frozen observed post-fission histories from L38-L40
  matrices: frozen L23 catalytic matrices
  candidates:
    - S12F-CANDIDATE-02
    - S12F-CANDIDATE-03
branchFamilies:
  F12:
    futureFissions: 12
    independentBranchesPerState: 128
    purpose: primary empirical committor
  F4:
    futureFissions: 4
    independentBranchesPerState: 64
    purpose: short process-aligned shooting coordinate
primaryEvent:
  id: ONLINE_TWO_RETURN_BOUNDARIES_H090
  clock: selected post-fission boundaries
  membership: strict H > 0.9
  generationGap: at least 2
  departure: immediately preceding boundary is H <= 0.9 to the same eligible reference
  return: current boundary is strict H > 0.9 to that reference
  perBoundaryCounting: at most one return certification regardless of matching-reference count
  requiredReturnBoundaries: 2
  certificationOnset: second qualifying future return boundary
  completedTestTrajectoryUsed: false
controls:
  - SPECIES_PERMUTED_PREFIX
  - UNRELATED_MATRIX_PREFIX
  - BRANCH_ONLY_HISTORY
  - ONE_LOCKED_FUTURE_ORDER_PERMUTATION_PER_BRANCH
  - NONADJACENT_MEMBERSHIP_WITHOUT_DEPARTURE
  - PARENT_DAUGHTER_INHERITANCE_FREQUENCY
  - PREFIX_INHERITANCE_FREQUENCY
  - CURRENT_MASS
  - GENERATION_PHASE
shortCoordinate:
  id: F4_MEAN_ONLINE_RETURN_BOUNDARY_COUNT
  independentFromF12: true
statistics:
  independentUnit: catalytic_matrix
  candidatesPooled: false
  bootstraps: 4096
  primaryIntermediateBand: [0.1, 0.9]
gates:
  correctedVarianceLower95: ">0"
  splitHalfSpearman: ">0.5"
  splitHalfLower95: ">0.3"
  intermediateStatesPerEvaluationGroup: 20
  primaryMinusSpeciesPermutedLower95: ">0"
  primaryMinusUnrelatedLower95: ">0"
  primaryMinusOrderPermutedLower95: ">0"
  membershipOpportunityMinusPrimary: ">=0.1"
  f4ToF12Spearman: ">0.5"
  f4ToF12Lower95: ">0.3"
scope:
  newMatrices: 0
  newTrajectories: 0
  newBranchStreams: 53760
  thresholdSearch: false
  recurrenceCountSearch: false
  horizonSearch: false
  completedRunTarget: none
ceilings:
  cpuHours: 100
  gpuHours: 0
  wallHours: 72
  retainedGiB: 25
  temporaryGiB: 75
  validationReserveFraction: 0.10
nextIfPass: UNTOUCHED_FISSION_CLOCK_RECURRENCE_CONFIRMATION
nextIfTargetPassesButProxyFails: ADAPTIVE_SHOOTING_EFFICIENCY_FOR_PROCESS_COMMITTOR
nextIfOrderFails: RECURRENCE_MEMBERSHIP_FREQUENCY_SUFFICIENT
nextIfTargetFails: FISSION_CONDITIONED_HEREDITY_RECOVERY_HAZARD
