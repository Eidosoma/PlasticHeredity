schema: eidosoma.e01.s19_l42.preregistration.v1
version: E01-S19-L42-FISSION-CONDITIONED-HEREDITY-RECOVERY-HAZARD-v1.0.0
status: PREOUTCOME_LOCK
question: >-
  After a future fission both breaks parent-daughter inheritance and genuinely
  departs from the preceding daughter composition, is there a reliable
  state-dependent probability of restoring a sustained inherited regime in
  that same compositional neighbourhood?
inputs:
  states: 280 frozen L28/L31 restored states
  branchPaths: exact L41 F12/F4 streams and identities
  newBranchStreams: 0
primaryEvent:
  id: SAME_NEIGHBOURHOOD_HEREDITY_RECOVERY_H090
  clock: selected post-fission boundaries
  firstBreak:
    parentDaughterInheritance: H <= 0.9
    departureFromPreviousDaughter: H <= 0.9
  recovery:
    inheritedFission: parent-daughter H > 0.9
    sameNeighbourhood: daughter-to-pre-break-daughter H > 0.9
    sustainedRun: 2 consecutive qualifying fissions
  certificationOnset: second qualifying recovery fission
  completedTestTrajectoryUsed: false
comparators:
  - INHERITANCE_RESUMPTION_ONLY
  - SPECIES_PERMUTED_PREBREAK_ANCHOR
  - UNRELATED_MATRIX_PREFIX_ANCHOR
  - EXACT_FIXED_COUNT_RECOVERY_ORDER_NULL
  - PREFIX_INHERITANCE_FREQUENCY
  - FUTURE_INHERITANCE_FREQUENCY
  - CURRENT_MASS
  - GENERATION_PHASE
shortCoordinate:
  id: F4_CONDITIONAL_MAXIMUM_INHERITED_RETURN_H
statistics:
  independentUnit: catalytic_matrix
  candidatesPooled: false
  bootstraps: 4096
  minimumBreakTrialsPerState: 32
  minimumBreakTrialsPerHalf: 16
gates:
  eligibleStatesPerEvaluationGroup: 32
  correctedVarianceLower95: ">0"
  splitHalfSpearman: ">0.5"
  splitHalfLower95: ">0.3"
  intermediateStatesPerEvaluationGroup: 20
  primaryMinusSpeciesPermutedLower95: ">0"
  primaryMinusUnrelatedLower95: ">0"
  primaryMinusOrderNullLower95: ">0"
  f4ProgressToF12Spearman: ">0.5"
  f4ProgressToF12Lower95: ">0.3"
scope:
  newMatrices: 0
  newTrajectories: 0
  newBranchStreams: 0
  thresholdSearch: false
  breakSearch: false
  recoveryRunSearch: false
  horizonSearch: false
  completedRunTarget: none
ceilings:
  cpuHours: 100
  gpuHours: 0
  wallHours: 72
  retainedGiB: 25
  temporaryGiB: 75
  validationReserveFraction: 0.10
nextIfPass: UNTOUCHED_HOMEOSTATIC_RECOVERY_CONFIRMATION
nextIfTargetPassesButProxyFails: HOMEOSTATIC_RECOVERY_SHOOTING_EFFICIENCY
nextIfOrderFails: INHERITANCE_RESUMPTION_FREQUENCY_SUFFICIENT
nextIfTargetFails: PROCESS_OUTCOME_FAMILY_IDENTIFIABILITY_AUDIT
