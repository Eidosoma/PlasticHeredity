[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arrival-of-replicators-replication"
version = "0.1.0"
description = "Independent clean-room replication of arXiv:2607.28250"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Independent replication"}]
dependencies = [
  "matplotlib>=3.7,<3.10",
  "networkx>=3.1,<3.4",
  "numpy>=1.24,<2",
  "pandas>=2.0,<2.3",
  "scikit-learn>=1.3,<1.6",
  "scipy>=1.10,<1.14",
  "seaborn>=0.13,<0.14",
  "statsmodels>=0.14,<0.15",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=4.1,<6",
]

[project.scripts]
aor-replicate = "aor_replication.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
