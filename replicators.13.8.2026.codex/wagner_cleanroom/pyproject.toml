[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wagner-cleanroom-replication"
version = "0.1.0"
description = "Clean-room Wagner exact-state and plastic-heredity prediction replication"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wagner-cleanroom = "wagner_cleanroom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wagner_cleanroom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

